name: vietfresh

x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    image: ${APP_IMAGE:?Set an immutable APP_IMAGE}
    restart: unless-stopped
    init: true
    env_file: .env.app
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=VietFresh_Hub;encrypt=true;trustServerCertificate=true"
      SPRING_DATASOURCE_USERNAME: ${APP_DB_USER:-vietfresh_app}
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
      VNPAY_ENABLED: ${VNPAY_ENABLED:-false}
      VNPAY_RETURN_URL: ${PUBLIC_URL:?Set PUBLIC_URL}/payment/vnpay/return
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65.0 -XX:+ExitOnOutOfMemoryError"
    mem_limit: 1536m
    stop_grace_period: 60s
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    volumes:
      - ./logs:/app/logs
      - product_uploads:/app/uploads/product
    depends_on:
      sqlserver:
        condition: service_healthy
    networks: [backend, edge]
    logging: *logging

  sqlserver:
    image: ${SQL_IMAGE:?Keep the existing SQL Server image}
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:?Set the existing licensed edition}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set existing SA password}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    mem_limit: 3g
    stop_grace_period: 90s
    volumes:
      - sql_data:/var/opt/mssql
      - ./backups:/var/opt/mssql/backup
    healthcheck:
      test:
        - CMD-SHELL
        - 'SQLCMDPASSWORD="$${MSSQL_SA_PASSWORD}" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q "SELECT 1" -o /dev/null'
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    networks: [backend]
    logging: *logging

  nginx:
    image: ${NGINX_IMAGE:-nginx:stable-alpine}
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8088}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
    mem_limit: 96m
    stop_grace_period: 30s
    networks: [edge]
    logging: *logging

networks:
  backend:
    internal: true
  edge:

volumes:
  sql_data:
    external: true
    name: ${SQL_VOLUME:-vietfresh_sql_data}
  product_uploads:
    name: vietfresh_product_uploads
