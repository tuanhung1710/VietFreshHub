map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
log_format request_json escape=json '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,"seconds":$request_time}';
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 120m;
    access_log /dev/stdout request_json;
    error_log /dev/stderr warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location = /healthz {
        proxy_pass http://app:8081/actuator/health/readiness;
        proxy_set_header Host $host;
        access_log off;
    }
    location ^~ /actuator { return 404; }
    location ~ /\. { return 404; }
    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
