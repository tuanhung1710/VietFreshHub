name: Verify and publish VietFreshHub

on:
  push:
    branches: [Hoang-Van-Son]
  pull_request:
    branches: [Hoang-Van-Son]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vietfresh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build the Java 21 production image
        run: docker build --progress=plain --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "vietfreshhub-test:$GITHUB_SHA" .

      - name: Verify startup and HTTP against an isolated SQL Server
        run: bash deploy/test-image.sh "vietfreshhub-test:$GITHUB_SHA"

      - name: Save the verified image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/Hoang-Van-Son'
        run: docker save -o image.tar "vietfreshhub-test:$GITHUB_SHA"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/Hoang-Van-Son'
        with:
          name: verified-image
          path: image.tar
          compression-level: 0
          retention-days: 1

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/Hoang-Van-Son'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-image
      - name: Load and publish the verified image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker load -i image.tar
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" \
            --password-stdin

          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"

          docker tag "vietfreshhub-test:$GITHUB_SHA" "$IMAGE_NAME:$GITHUB_SHA"
          docker tag "vietfreshhub-test:$GITHUB_SHA" "$IMAGE_NAME:son-latest"

          docker push "$IMAGE_NAME:$GITHUB_SHA"
          docker push "$IMAGE_NAME:son-latest"
