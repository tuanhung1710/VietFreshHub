spring.application.name=VietFresh_Hub
app.checkout.shipping-fee-per-shop=${CHECKOUT_SHIPPING_FEE_PER_SHOP:20000.00}
app.payout.commission-rate=0.10
app.payout.morning-cron=${PAYOUT_MORNING_CRON:0 0 10 * * *}
app.payout.afternoon-cron=${PAYOUT_AFTERNOON_CRON:0 0 16 * * *}
app.payout.time-zone=${PAYOUT_TIME_ZONE:Asia/Ho_Chi_Minh}
server.port=9999

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=VietFresh_Hub4;encrypt=false
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.hbm2ddl.auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.banner.charset=utf-8

# Provide via environment variables: CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=120MB

spring.mail.host=smtp.gmail.com
spring.mail.port=587
# Provide via environment variables: MAIL_USERNAME, MAIL_PASSWORD
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true

spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=3000
spring.mail.properties[mail.smtp.writetimeout]=5000
spring.mail.properties[mail.smtp.ssl.trust]=smtp.gmail.com
app.mail.from=${spring.mail.username}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.scope[0]=openid
spring.security.oauth2.client.registration.google.scope[1]=profile
spring.security.oauth2.client.registration.google.scope[2]=email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
vietmap.api-key=${VIETMAP_API_KEY:}
vietmap.base-url=https://maps.vietmap.vn

app.vnpay.enabled=${VNPAY_ENABLED:true}
app.vnpay.tmn-code=${VNPAY_TMN_CODE:6CBHNFW9}
app.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
app.vnpay.payment-url=${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
app.vnpay.query-url=${VNPAY_QUERY_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
app.vnpay.query-ip-address=${VNPAY_QUERY_IP:127.0.0.1}
app.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:${server.port}/payment/vnpay/return}
app.vnpay.expiry-minutes=${VNPAY_EXPIRY_MINUTES:15}
app.vnpay.expiry-scan-ms=${VNPAY_EXPIRY_SCAN_MS:30000}
