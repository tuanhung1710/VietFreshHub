spring.thymeleaf.cache=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=45s
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=60000
management.server.port=8081
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.health.mail.enabled=false
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=/app/logs/access
server.tomcat.accesslog.max-days=14
server.tomcat.accesslog.pattern=%t peer=%a method=%m path=%U status=%s bytes=%b duration_us=%D
