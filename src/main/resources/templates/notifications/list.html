<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/notification-workspace :: head}"></head>
<body class="vfo-app vfn-app">
<th:block th:replace="~{fragments/notification-workspace :: navigation}"></th:block>
<div id="workspace-content" class="vfo-workspace" tabindex="-1">
    <span id="order-content" class="vfn-skip-target" tabindex="-1"></span>
    <span id="delivery-content" class="vfn-skip-target" tabindex="-1"></span>
    <main id="notification-inbox" class="vfo-main vfn-main">
        <header class="vfo-page-heading">
            <div><h1>Thông báo</h1></div>
            <a class="btn vfo-btn-secondary" th:if="${#authorization.expression('!hasAnyRole(''DELIVERY_STAFF'',''STORE_MANAGER'')')}" th:href="@{/}"><span aria-hidden="true">←</span> Về trang chính</a>
        </header>
        <p id="notification-refresh-status" class="vfm-notice vfm-notice-warning vfn-refresh-status" role="status"></p>
        <section class="card vfo-list-card vfn-inbox-card" aria-labelledby="inbox-heading">
            <div class="vfo-list-heading"><div><span class="vfo-section-marker" aria-hidden="true"></span><h2 id="inbox-heading">Hộp thư thông báo</h2><span class="vfo-count" th:text="${notificationsPage.totalElements}"></span></div><span class="vfo-list-caption" th:if="${#authorization.expression('!hasRole(''STORE_MANAGER'')')}">Thông báo của bạn</span></div>
            <div class="vfo-empty-state" th:if="${notificationsPage.empty}"><span class="vfo-empty-icon"><svg class="vfo-icon" aria-hidden="true"><use href="#vfo-bell"/></svg></span><h3>Hộp thư đang trống</h3><p>Bạn chưa có thông báo nào.</p></div>
            <ul class="vfn-notification-list" th:unless="${notificationsPage.empty}">
                <li th:each="notification : ${notificationsPage}">
                    <article class="vfn-notification" th:classappend="${notification.readAt == null ? 'vfn-unread' : ''}">
                        <span class="vfn-notification-icon"><svg class="vfo-icon" aria-hidden="true"><use href="#vfo-bell"/></svg></span>
                        <div class="vfn-notification-body">
                            <header class="vfn-notification-heading">
                                <h2><strong th:if="${notification.readAt == null}" th:text="${notification.title}"></strong><span th:unless="${notification.readAt == null}" th:text="${notification.title}"></span></h2>
                                <span class="vfn-unread-label" th:if="${notification.readAt == null}">Chưa đọc</span>
                            </header>
                            <p class="vfn-content" th:text="${notification.content}"></p>
                            <div class="vfn-notification-meta">
                                <p>Ngày nhận: <time th:text="${#temporals.format(notification.createdAt, 'dd/MM/yyyy HH:mm:ss')}"></time></p>
                                <p th:unless="${notification.readAt == null}" th:text="|Đã đọc lúc ${#temporals.format(notification.readAt, 'dd/MM/yyyy HH:mm:ss')}|"></p>
                                <p th:if="${notification.entityId != null}" th:switch="${notification.entityType}"><span th:case="'DELIVERY_ASSIGNMENT'" th:text="|Phân công giao hàng #${notification.entityId}|"></span><span th:case="'DELIVERY'" th:text="|Giao hàng #${notification.entityId}|"></span></p>
                            </div>
                            <div class="vfn-notification-actions">
                                <a class="btn vfo-btn-secondary" th:if="${notification.hasDetail()}" th:href="@{/notifications/{id}/open(id=${notification.notificationId})}">Xem chi tiết <span aria-hidden="true">→</span></a>
                                <form th:if="${notification.readAt == null}" method="post" th:action="@{/notifications/{id}/read(id=${notification.notificationId})}">
                                    <input type="hidden" name="page" th:value="${notificationsPage.number}">
                                    <button class="btn vfn-read-button" type="submit"><svg class="vfo-icon vfo-icon-sm" aria-hidden="true"><use href="#vfo-check"/></svg>Đánh dấu đã đọc</button>
                                </form>
                            </div>
                        </div>
                    </article>
                </li>
            </ul>
            <nav class="vfn-pagination" th:if="${notificationsPage.totalPages > 1}" aria-label="Phân trang thông báo">
                <a class="btn vfo-btn-secondary" th:if="${notificationsPage.hasPrevious()}" th:href="@{/notifications(page=${notificationsPage.number - 1})}"><span aria-hidden="true">←</span> Trang trước</a>
                <span th:text="|Trang ${notificationsPage.number + 1} / ${notificationsPage.totalPages}|"></span>
                <a class="btn vfo-btn-secondary" th:if="${notificationsPage.hasNext()}" th:href="@{/notifications(page=${notificationsPage.number + 1})}">Trang sau <span aria-hidden="true">→</span></a>
            </nav>
        </section>
    </main>
    <footer th:replace="~{fragments/notification-workspace :: footer}"></footer>
</div>
</body>
</html>
