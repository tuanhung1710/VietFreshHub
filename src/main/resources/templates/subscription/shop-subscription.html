<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gói dịch vụ hiện tại | VietFresh Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root { --bs-body-font-family: 'Be Vietnam Pro', sans-serif; --bs-success-rgb: 0,107,44; --bs-primary-rgb: 0,107,44; }
        body { background: #f8f9ff; color: #0b1c30; }
        .btn-success { background: #006b2c; border-color: #006b2c; }
        .btn-success:hover, .btn-success:focus { background: #005320; border-color: #005320; }
        .btn-outline-success { color: #006b2c; border-color: #006b2c; }
        .btn-outline-success:hover { background: #006b2c; border-color: #006b2c; }
        .card { border: 1px solid #e5eeff; }
        .benefits { white-space: pre-line; overflow-wrap: anywhere; }
        .table > :not(caption) > * > * { padding: 1rem; }
        .table thead th { font-size: .8rem; color: #6c757d; }
    </style>
</head>
<body>
<main class="container-xl py-4">
    <a th:href="@{/seller}" class="btn btn-outline-secondary btn-sm mb-3"><i class="bi bi-arrow-left" aria-hidden="true"></i> Quay lại cửa hàng</a>
<nav class="d-flex flex-wrap gap-2 mb-4" aria-label="Gói dịch vụ">
        <a th:href="@{/seller/subscription}" class="btn btn-outline-success btn-sm">Gói hiện tại</a>
        <a th:href="@{/seller/subscription/payments}" class="btn btn-outline-secondary btn-sm">Lịch sử thanh toán</a>
        <a th:href="@{/seller/subscription/history}" class="btn btn-outline-secondary btn-sm">Lịch sử đăng ký</a>
    </nav>
    <h1 class="h3 fw-bold mb-4">Gói dịch vụ hiện tại</h1>
    <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

    <section th:if="${currentSubscription != null}" class="card border-0 shadow-sm rounded-3">
        <div class="card-body p-4">
            <div class="d-flex flex-wrap justify-content-between gap-2 mb-3">
                <h2 class="h4 text-success fw-bold" th:text="${currentSubscription.planName}"></h2>
                <span class="badge rounded-pill" th:classappend="${currentSubscription.status.name() == 'ACTIVE' ? 'bg-success-subtle text-success' : (currentSubscription.status.name() == 'UPGRADED' ? 'bg-warning-subtle text-dark' : (currentSubscription.status.name() == 'CANCELLED' ? 'bg-danger-subtle text-danger' : 'bg-secondary-subtle text-secondary'))}" th:text="${currentSubscription.status}"></span>
            </div>
            <dl class="row">
                <dt class="col-sm-4">Bắt đầu (UTC)</dt><dd class="col-sm-8" th:text="${currentSubscription.startAt != null ? #temporals.format(currentSubscription.startAt, 'dd/MM/yyyy HH:mm') : '—'}"></dd>
                <dt class="col-sm-4">Hết hạn (UTC)</dt><dd class="col-sm-8" th:text="${currentSubscription.endAt != null ? #temporals.format(currentSubscription.endAt, 'dd/MM/yyyy HH:mm') : '—'}"></dd>
                <dt class="col-sm-4">Hạn mức sản phẩm</dt><dd class="col-sm-8" th:text="${currentSubscription.maxProducts}"></dd>
                <dt class="col-sm-4">Quyền lợi</dt><dd class="col-sm-8 benefits" th:text="${#strings.isEmpty(currentSubscription.benefits) ? 'Chưa có mô tả quyền lợi.' : currentSubscription.benefits}"></dd>
            </dl>
            <div class="d-flex flex-wrap gap-2 border-top pt-3">
            </div>
        </div>
    </section>
    <section th:if="${currentSubscription == null}" class="card border-0 shadow-sm rounded-3">
        <div class="card-body p-4">
            <span class="badge bg-success-subtle text-success mb-3">Miễn phí</span>
            <h2 class="h4 fw-bold text-success">Free</h2>
            <p class="text-secondary">Shop chưa có gói còn hiệu lực. Quyền lợi Free được áp dụng mặc định.</p>
            <dl th:if="${freePlan != null}" class="row">
                <dt class="col-sm-4">Hạn mức sản phẩm</dt><dd class="col-sm-8" th:text="${freePlan.maxProducts}"></dd>
                <dt class="col-sm-4">Quyền lợi</dt><dd class="col-sm-8 benefits" th:text="${#strings.isEmpty(freePlan.benefits) ? 'Chưa có mô tả quyền lợi.' : freePlan.benefits}"></dd>
            </dl>
        </div>
    </section>
</main>
</body>
</html>
