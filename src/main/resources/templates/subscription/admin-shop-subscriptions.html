<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký gói dịch vụ của các shop | VietFresh Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root { --bs-body-font-family: 'Be Vietnam Pro', sans-serif; --bs-success-rgb: 0,107,44; --bs-primary-rgb: 0,107,44; }
        body { background: #f8f9ff; color: #0b1c30; }
        .btn-success { background: #006b2c; border-color: #006b2c; }
        .btn-success:hover, .btn-success:focus { background: #005320; border-color: #005320; }
        .btn-outline-success { color: #006b2c; border-color: #006b2c; }
        .btn-outline-success:hover { background: #006b2c; border-color: #006b2c; }
        .card { border: 1px solid #e5eeff; }
        .benefits { white-space: pre-line; overflow-wrap: anywhere; }
        .table > :not(caption) > * > * { padding: 1rem; }
        .table thead th { font-size: .8rem; color: #6c757d; }
    </style>
</head>
<body>
<main class="container-xl py-4">
<nav class="d-flex flex-wrap gap-2 mb-4" aria-label="Quản trị gói dịch vụ">
        <a th:href="@{/admin}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left" aria-hidden="true"></i> Trang quản trị</a>
        <a th:href="@{/admin/subscription-plans}" class="btn btn-outline-success btn-sm">Danh mục gói</a>
        <a th:href="@{/admin/shop-subscriptions}" class="btn btn-outline-success btn-sm">Đăng ký của shop</a>
        <a th:href="@{/admin/shop-subscriptions/payments}" class="btn btn-outline-success btn-sm">Yêu cầu thanh toán</a>
    </nav>
    <h1 class="h3 fw-bold mb-4">Đăng ký gói dịch vụ của các shop</h1>
    <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

    <div class="card shadow-sm border-0 rounded-3 overflow-hidden"><div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <caption class="px-3">Lịch sử đăng ký và thời hạn sử dụng. Thời gian hiển thị theo UTC.</caption>
            <thead class="table-light"><tr><th scope="col">Mã đăng ký</th><th scope="col">Shop</th><th scope="col">Gói dịch vụ</th><th scope="col">Bắt đầu</th><th scope="col">Hết hạn</th><th scope="col">Trạng thái</th></tr></thead>
            <tbody>
                <tr th:if="${subscriptionPage.empty}"><td colspan="6" class="text-center text-secondary py-5">Chưa có đăng ký gói dịch vụ.</td></tr>
                <tr th:each="subscription : ${subscriptionPage.content}">
                    <td th:text="${subscription.subscriptionId}"></td>
                    <td><div class="fw-semibold" th:text="${subscription.shopName}"></div><small class="text-secondary" th:text="${'ID: ' + subscription.shopId}"></small></td>
                    <td class="fw-semibold" th:text="${subscription.planName}"></td>
                    <td class="text-nowrap" th:text="${subscription.startAt != null ? #temporals.format(subscription.startAt, 'dd/MM/yyyy HH:mm') : '—'}"></td>
                    <td class="text-nowrap" th:text="${subscription.endAt != null ? #temporals.format(subscription.endAt, 'dd/MM/yyyy HH:mm') : '—'}"></td>
                    <td><span class="badge rounded-pill" th:classappend="${subscription.status.name() == 'ACTIVE' ? 'bg-success-subtle text-success' : (subscription.status.name() == 'UPGRADED' ? 'bg-warning-subtle text-dark' : (subscription.status.name() == 'CANCELLED' ? 'bg-danger-subtle text-danger' : 'bg-secondary-subtle text-secondary'))}" th:text="${subscription.status}"></span></td>
                </tr>
            </tbody>
        </table>
    </div></div>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mt-4">
        <span class="text-secondary small" th:text="${'Tổng cộng ' + subscriptionPage.totalElements + ' đăng ký'}"></span>
        <nav th:if="${subscriptionPage.totalPages > 0}" aria-label="Phân trang đăng ký">
            <ul class="pagination mb-0">
                <li class="page-item" th:classappend="${!subscriptionPage.hasPrevious() ? 'disabled' : ''}">
                    <a th:if="${subscriptionPage.hasPrevious()}" class="page-link text-success" th:href="@{/admin/shop-subscriptions(page=${subscriptionPage.number - 1})}">Trước</a>
                    <span th:unless="${subscriptionPage.hasPrevious()}" class="page-link">Trước</span>
                </li>
                <li class="page-item"><span class="page-link text-dark" aria-current="page" th:text="${(subscriptionPage.number + 1) + ' / ' + subscriptionPage.totalPages}"></span></li>
                <li class="page-item" th:classappend="${!subscriptionPage.hasNext() ? 'disabled' : ''}">
                    <a th:if="${subscriptionPage.hasNext()}" class="page-link text-success" th:href="@{/admin/shop-subscriptions(page=${subscriptionPage.number + 1})}">Sau</a>
                    <span th:unless="${subscriptionPage.hasNext()}" class="page-link">Sau</span>
                </li>
            </ul>
        </nav>
    </div>
</main>
</body>
</html>
