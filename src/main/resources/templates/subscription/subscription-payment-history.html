<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử thanh toán | VietFresh Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root { --bs-body-font-family: 'Be Vietnam Pro', sans-serif; --bs-success-rgb: 0,107,44; --bs-primary-rgb: 0,107,44; }
        body { background: #f8f9ff; color: #0b1c30; }
        .btn-success { background: #006b2c; border-color: #006b2c; }
        .btn-success:hover, .btn-success:focus { background: #005320; border-color: #005320; }
        .btn-outline-success { color: #006b2c; border-color: #006b2c; }
        .btn-outline-success:hover { background: #006b2c; border-color: #006b2c; }
        .card { border: 1px solid #e5eeff; }
        .benefits { white-space: pre-line; overflow-wrap: anywhere; }
        .table > :not(caption) > * > * { padding: 1rem; }
        .table thead th { font-size: .8rem; color: #6c757d; }
    </style>
</head>
<body>
<main class="container-xl py-4">
    <a th:href="@{/seller}" class="btn btn-outline-secondary btn-sm mb-3"><i class="bi bi-arrow-left" aria-hidden="true"></i> Quay lại cửa hàng</a>
<nav class="d-flex flex-wrap gap-2 mb-4" aria-label="Gói dịch vụ">
        <a th:href="@{/seller/subscription}" class="btn btn-outline-success btn-sm">Gói hiện tại</a>
        <a th:href="@{/seller/subscription/payments}" class="btn btn-outline-secondary btn-sm">Lịch sử thanh toán</a>
    </nav>
    <h1 class="h3 fw-bold mb-4">Lịch sử thanh toán</h1>
    <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

    <div class="card shadow-sm border-0 rounded-3 overflow-hidden"><div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <caption class="px-3">Các yêu cầu thanh toán của shop. Thời gian hiển thị theo UTC.</caption>
            <thead class="table-light"><tr><th scope="col">Mã yêu cầu</th><th scope="col">Gói / Thao tác</th><th scope="col">Số tiền</th><th scope="col">Ngày tạo</th><th scope="col">Trạng thái</th><th scope="col">Chi tiết</th></tr></thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(payments)}"><td colspan="6" class="text-center text-secondary py-5">Chưa có yêu cầu thanh toán.</td></tr>
                <tr th:each="payment : ${payments}">
                    <td th:text="${payment.subscriptionPaymentId}"></td>
                    <td><div class="fw-semibold" th:text="${payment.planName}"></div><small class="text-secondary" th:text="${payment.action.name() == 'SUBSCRIBE' ? 'Đăng ký' : (payment.action.name() == 'RENEW' ? 'Gia hạn' : 'Nâng cấp')}"></small></td>
                    <td class="text-nowrap" th:text="${#numbers.formatDecimal(payment.amount, 1, 'WHITESPACE', 0, 'POINT') + ' VND'}"></td>
                    <td class="text-nowrap" th:text="${payment.createdAt != null ? #temporals.format(payment.createdAt, 'dd/MM/yyyy HH:mm') : '—'}"></td>
                    <td><span class="badge rounded-pill" th:classappend="${payment.status.name() == 'PAID' ? 'bg-success-subtle text-success' : (payment.status.name() == 'PENDING' ? 'bg-warning-subtle text-dark' : (payment.status.name() == 'FAILED' ? 'bg-danger-subtle text-danger' : 'bg-secondary-subtle text-secondary'))}" th:text="${payment.status}"></span></td>
                    <td><a class="btn btn-outline-success btn-sm text-nowrap" th:href="@{/seller/subscription/payments/{id}(id=${payment.subscriptionPaymentId})}" th:aria-label="${'Xem yêu cầu ' + payment.subscriptionPaymentId}">Xem chi tiết</a></td>
                </tr>
            </tbody>
        </table>
    </div></div>
</main>
</body>
</html>
