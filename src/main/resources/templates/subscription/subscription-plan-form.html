<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${editing ? 'Sửa gói dịch vụ' : 'Tạo gói dịch vụ'}">Gói dịch vụ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/admin-accounts.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/admin-subscription.css}">
</head>
<body class="subscription-page subscription-form-page">
<div class="app-shell">
    <header class="topbar">
        <a class="brand" th:href="@{/admin/accounts}" aria-label="VietFresh Hub, trung tâm quản trị"><span class="brand-mark" aria-hidden="true">V</span><span><strong>VietFresh Hub</strong><small>TRUNG TÂM QUẢN TRỊ</small></span></a>
        <div class="topbar-right"><span th:replace="~{fragments/notifications :: bell}"></span><span class="admin-label">QUẢN TRỊ VIÊN</span><span class="admin-avatar" aria-label="Quản trị viên">AD</span></div>
    </header>
<main class="page-content">
    <nav class="breadcrumbs" aria-label="Điều hướng"><a th:href="@{/admin/accounts}">Quản trị</a><span aria-hidden="true">/</span><a th:href="@{/admin/subscription-plans}">Gói dịch vụ</a><span aria-hidden="true">/</span><strong th:text="${editing ? 'Sửa gói' : 'Tạo gói mới'}">Tạo gói mới</strong></nav>
    <section class="page-heading"><div><p class="eyebrow">QUẢN LÝ GÓI DỊCH VỤ</p><h1 th:text="${pageTitle != null ? pageTitle : (editing ? 'Sửa gói dịch vụ' : 'Tạo gói dịch vụ')}">Tạo gói dịch vụ</h1></div></section>

    <div class="accounts-panel subscription-form-card">
        <div class="subscription-card-body">

            <form th:action="${editing}
                      ? @{/admin/subscription-plans/{planId}/update(planId=${planId})}
                      : @{/admin/subscription-plans}"
                  th:object="${form}"
                  method="post">
                <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="alert alert-danger"
                     role="alert"
                     th:if="${#fields.hasAnyErrors()}">
                    <strong>Vui lòng kiểm tra lại:</strong>
                    <ul class="mb-0 mt-2">
                        <li th:each="error : ${#fields.allErrors()}"
                            th:text="${error}"></li>
                    </ul>
                </div>

                <div class="mb-3">
                    <label for="name" class="form-label fw-semibold">
                        Tên gói dịch vụ <span class="text-danger">*</span>
                    </label>
                    <input id="name"
                           type="text"
                           class="form-control"
                           th:field="*{name}"
                           th:errorclass="is-invalid"
                           placeholder="Ví dụ: Gói Hợp Tác Xã Tiêu Chuẩn"
                           maxlength="100"
                           required>
                    <div class="invalid-feedback"
                         th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label fw-semibold">
                        Mô tả ngắn
                    </label>
                    <textarea id="description"
                              class="form-control"
                              th:field="*{description}"
                              th:errorclass="is-invalid"
                              maxlength="1000"
                              rows="3"
                              placeholder="Mô tả tóm tắt giá trị của gói khi giới thiệu đến Store Manager..."></textarea>
                    <div class="invalid-feedback"
                         th:errors="*{description}"></div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="price" class="form-label fw-semibold">
                            Giá cước (VND) <span class="text-danger">*</span>
                        </label>
                        <div class="input-group has-validation">
                            <input id="price"
                                   type="number"
                                   class="form-control"
                                   th:field="*{price}"
                                   th:errorclass="is-invalid"
                                   min="0"
                                   step="0.01"
                                   placeholder="199000"
                                   required>
                            <span class="input-group-text">VND</span>
                            <div class="invalid-feedback"
                                 th:errors="*{price}"></div>
                        </div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="billingPeriod" class="form-label fw-semibold">
                            Chu kỳ thanh toán <span class="text-danger">*</span>
                        </label>
                        <select id="billingPeriod"
                                class="form-select"
                                th:field="*{billingPeriod}"
                                th:errorclass="is-invalid"
                                required>
                            <option value="">-- Chọn chu kỳ --</option>
                            <option th:each="period : ${billingPeriods}"
                                    th:value="${period.name()}"
                                    th:text="${period.name() == 'MONTHLY' ? 'Hàng tháng (Monthly)' : (period.name() == 'QUARTERLY' ? 'Hàng quý (Quarterly)' : 'Hàng năm (Yearly)')}">
                            </option>
                        </select>
                        <div class="invalid-feedback"
                             th:errors="*{billingPeriod}"></div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="maxProducts" class="form-label fw-semibold">
                            Giới hạn sản phẩm niêm yết (Public) <span class="text-danger">*</span>
                        </label>
                        <input id="maxProducts"
                               type="number"
                               class="form-control"
                               th:field="*{maxProducts}"
                               th:errorclass="is-invalid"
                               min="1"
                               step="1"
                               placeholder="50"
                               required>
                        <div class="invalid-feedback"
                             th:errors="*{maxProducts}"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="status" class="form-label fw-semibold">
                            Trạng thái hoạt động <span class="text-danger">*</span>
                        </label>
                        <select id="status"
                                class="form-select"
                                th:field="*{status}"
                                th:errorclass="is-invalid"
                                required>
                            <option th:each="st : ${planStatuses}"
                                    th:value="${st.name()}"
                                    th:text="${st.name() == 'ACTIVE' ? 'Đang hoạt động (Hiển thị)' : 'Đang tắt (Ẩn)'}">
                            </option>
                        </select>
                        <div class="invalid-feedback"
                             th:errors="*{status}"></div>
                    </div>
                </div>

                <div class="mb-4">
                    <div class="mb-1">
                        <label for="benefits" class="form-label fw-semibold mb-0">
                            Quyền lợi của gói
                        </label>
                    </div>
                    <textarea id="benefits"
                              class="form-control font-monospace"
                              th:field="*{benefits}"
                              th:errorclass="is-invalid"
                              rows="5"
                              placeholder="Chứng nhận chuẩn VietGAP ưu tiên&#10;Hỗ trợ tư vấn pháp lý 24/7&#10;Báo cáo phân tích doanh thu nâng cao&#10;Miễn phí nhãn QR truy xuất nguồn gốc"></textarea>
                    <div class="invalid-feedback"
                         th:errors="*{benefits}"></div>
                </div>

                <div class="subscription-actions">
                    <a th:href="@{/admin/subscription-plans}"
                       class="button">
                        Hủy
                    </a>
                    <button type="submit"
                            class="button primary"
                            th:text="${editing} ? 'Lưu thay đổi' : 'Tạo gói dịch vụ'">
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>
</div>
</body>
</html>
