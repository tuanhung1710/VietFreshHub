<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

    <!-- Tài nguyên trang -->
    <head th:replace="~{fragments/product-inventory :: head('Nhập kho','inventory')}">
    </head>

    <body class="vfo-app vfr-app vfr-product vfr-seller" data-vfr-section="inventory">

        <!-- Điều hướng Seller Portal -->
        <header th:replace="~{fragments/product-inventory :: nav('inventory')}">
        </header>

        <!-- Nội dung chính -->
        <div class="vf-workspace" id="order-content" tabindex="-1">
        <main class="container vf-main narrow vf-inventory-main vfr-page">
            <a class="d-inline-block mb-3 text-success text-decoration-none" th:href="@{${inventoryReturnUrl}}">
                ← Quay lại
            </a>
            <h1>
                Nhập lô hàng mới
            </h1>
            <p
                class="text-body-secondary mb-4"
                th:text="${variant.productName+' · '+variant.variant.sku+' · '+variant.variant.unit}"
            >
            </p>

            <!-- Biểu mẫu -->
            <form
                class="card p-4 form-stack vf-inventory-form"
                th:object="${form}"
                th:action="@{/seller/inventory/products/{p}/variants/{v}/restock(p=${productId},v=${variantId})}"
                method="post"
            >
                <input type="hidden" name="returnTo" th:value="${inventoryReturnUrl}">
                <div th:replace="~{fragments/product-inventory :: errors}">
                </div>
                <h2 class="h5 mb-3">
                    Thông tin lô hàng
                </h2>
                <div class="row g-3 batch-dates">
                    <label class="col-md-6 form-label" for="quantity">
                        Số lượng nhập
                        <span class="text-danger">
                            *
                        </span>
                        <input
                            class="form-control mt-1"
                            id="quantity"
                            type="number"
                            min="1"
                            step="1"
                            th:field="*{quantity}"
                            required
                        >
                    </label>
                    <label class="col-md-6 form-label" for="costPrice">
                        Giá vốn mỗi đơn vị (₫)
                        <input
                            class="form-control mt-1"
                            id="costPrice"
                            type="number"
                            min="0"
                            step="0.01"
                            data-vf-money
                            th:field="*{costPrice}"
                        >
                    </label>
                    <label class="col-md-6 form-label" for="receivedDate">
                        Ngày nhập kho
                        <span class="text-danger">
                            *
                        </span>
                        <input
                            class="form-control mt-1 batch-received-date"
                            id="receivedDate"
                            type="date"
                            th:field="*{receivedDate}"
                            th:max="${today}"
                            required
                        >
                    </label>
                    <label class="col-md-6 form-label" for="expiryDate">
                        Hạn sử dụng
                        <span class="text-danger">
                            *
                        </span>
                        <input
                            class="form-control mt-1 batch-expiry-date"
                            id="expiryDate"
                            type="date"
                            th:field="*{expiryDate}"
                            th:min="${today}"
                            required
                        >
                    </label>
                    <label class="col-12 form-label" for="reason">
                        Lý do nhập kho
                        <span class="text-danger">
                            *
                        </span>
                        <input
                            class="form-control mt-1"
                            id="reason"
                            th:field="*{reason}"
                            maxlength="900"
                            required
                        >
                    </label>
                </div>
                <div class="d-flex flex-wrap gap-2 mt-4 vf-inventory-form-actions">
                    <button type="submit" class="btn btn-success">
                        Nhập kho
                    </button>
                    <a class="btn btn-outline-secondary" th:href="@{${inventoryReturnUrl}}">
                        Hủy
                    </a>
                </div>
            </form>

        </main>

        </div>

        <script defer th:src="@{/js/inventory/inventory.js}"></script>
    <div class="vfr-product-footer"><footer th:replace="~{fragments/seller-orders :: footer}"></footer></div>
</body>
</html>
