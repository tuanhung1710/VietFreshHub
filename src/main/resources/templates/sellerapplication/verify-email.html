<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Xác minh email | VietFresh Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-emerald-50 text-slate-900">
<main class="mx-auto flex min-h-screen max-w-5xl items-center justify-center px-4 py-10">
    <section class="w-full max-w-lg rounded-2xl border border-emerald-100 bg-white p-6 shadow-lg sm:p-9">
        <a class="text-sm font-semibold text-emerald-800 hover:underline" th:href="@{/seller-onboarding/register}">← Đăng ký bán hàng</a>
        <p class="mt-7 text-sm font-bold uppercase tracking-wide text-emerald-700">Xác minh tài khoản</p>
        <h1 class="mt-2 text-3xl font-bold">Nhập mã OTP</h1>
        <p class="mt-3 text-slate-600">Mã xác minh đã được gửi đến <strong class="text-slate-900" th:text="${email}"></strong>. Mã có hiệu lực trong 10 phút.</p>

        <div th:if="${successMessage}" class="mt-5 rounded-lg bg-emerald-50 p-3 text-sm text-emerald-900" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="mt-5 rounded-lg bg-rose-50 p-3 text-sm text-rose-800" th:text="${errorMessage}"></div>

        <form class="mt-6 space-y-4" th:action="@{/seller-onboarding/verify-email}" method="post">
            <div>
                <label class="mb-1 block text-sm font-semibold" for="otp">Mã OTP gồm 6 chữ số</label>
                <input class="w-full rounded-lg border border-slate-300 px-3 py-3 text-center text-xl tracking-[0.5em] focus:border-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-100"
                       id="otp" name="otp" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
            </div>
            <button class="w-full rounded-lg bg-emerald-700 px-4 py-3 font-bold text-white hover:bg-emerald-800 focus:outline-none focus:ring-2 focus:ring-emerald-300"
                    type="submit">Xác minh và tiếp tục nộp hồ sơ</button>
        </form>
        <form class="mt-4 text-center" th:action="@{/seller-onboarding/verify-email/resend}" method="post">
            <button class="text-sm font-semibold text-emerald-800 hover:underline" type="submit">Gửi lại mã OTP</button>
        </form>
    </section>
</main>
</body>
</html>
