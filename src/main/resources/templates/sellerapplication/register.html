<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký bán hàng | VietFresh Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-emerald-50 text-slate-900">
<main class="mx-auto flex min-h-screen max-w-5xl items-center justify-center px-4 py-10">
    <section class="w-full max-w-xl rounded-2xl border border-emerald-100 bg-white p-6 shadow-lg sm:p-9">
        <a class="text-sm font-semibold text-emerald-800 hover:underline" th:href="@{/login}">← VietFresh Hub</a>
        <p class="mt-7 text-sm font-bold uppercase tracking-wide text-emerald-700">Kênh đối tác</p>
        <h1 class="mt-2 text-3xl font-bold">Đăng ký bán hàng</h1>
        <p class="mt-3 text-slate-600">Tạo thông tin đăng nhập, xác minh email rồi gửi hồ sơ shop để admin xét duyệt.</p>

        <div th:if="${errorMessage}" class="mt-5 rounded-lg bg-rose-50 p-3 text-sm text-rose-800" th:text="${errorMessage}"></div>
        <form class="mt-6 space-y-4" th:action="@{/seller-onboarding/register}" th:object="${registerRequest}" method="post">
            <div th:if="${#fields.hasGlobalErrors()}" class="rounded-lg bg-rose-50 p-3 text-sm text-rose-800">
                <p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
            </div>
            <div>
                <label class="mb-1 block text-sm font-semibold" for="fullName">Họ và tên</label>
                <input class="w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:border-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-100"
                       id="fullName" type="text" autocomplete="name" th:field="*{fullName}" required>
                <p class="mt-1 text-sm text-rose-700" th:errors="*{fullName}"></p>
            </div>
            <div>
                <label class="mb-1 block text-sm font-semibold" for="email">Email</label>
                <input class="w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:border-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-100"
                       id="email" type="email" autocomplete="email" th:field="*{email}" required>
                <p class="mt-1 text-sm text-rose-700" th:errors="*{email}"></p>
            </div>
            <div>
                <label class="mb-1 block text-sm font-semibold" for="phone">Số điện thoại</label>
                <input class="w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:border-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-100"
                       id="phone" type="tel" autocomplete="tel" th:field="*{phone}" required>
                <p class="mt-1 text-sm text-rose-700" th:errors="*{phone}"></p>
            </div>
            <div>
                <label class="mb-1 block text-sm font-semibold" for="password">Mật khẩu</label>
                <input class="w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:border-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-100"
                       id="password" type="password" autocomplete="new-password" th:field="*{password}" required>
                <p class="mt-1 text-sm text-rose-700" th:errors="*{password}"></p>
            </div>
            <div>
                <label class="mb-1 block text-sm font-semibold" for="confirmPassword">Nhập lại mật khẩu</label>
                <input class="w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:border-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-100"
                       id="confirmPassword" type="password" autocomplete="new-password" th:field="*{confirmPassword}" required>
                <p class="mt-1 text-sm text-rose-700" th:errors="*{confirmPassword}"></p>
            </div>
            <label class="flex items-start gap-2 text-sm text-slate-700">
                <input class="mt-1" type="checkbox" th:field="*{terms}">
                <span>Tôi đồng ý với điều khoản sử dụng VietFresh Hub.</span>
            </label>
            <p class="-mt-3 text-sm text-rose-700" th:errors="*{terms}"></p>
            <p class="text-sm text-rose-700" th:if="${#fields.hasErrors('passwordMatching')}"
               th:errors="*{passwordMatching}"></p>
            <button class="w-full rounded-lg bg-emerald-700 px-4 py-3 font-bold text-white hover:bg-emerald-800 focus:outline-none focus:ring-2 focus:ring-emerald-300"
                    type="submit">Tiếp tục xác minh email</button>
        </form>

        <p class="mt-6 text-center text-sm text-slate-600">
            Đã có tài khoản?
            <a class="font-semibold text-emerald-800 hover:underline" th:href="@{/login}">Đăng nhập</a>
        </p>
    </section>
</main>
</body>
</html>
