<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

    <th:block th:replace="~{fragments/interface-layout :: foundation}"></th:block>
    
    
    <title>Thông tin không hợp lệ | VietFresh Hub</title>
    <link rel="stylesheet" th:href="@{/css/storefront.css}">
