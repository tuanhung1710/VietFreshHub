<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cấu hình quy tắc dùng tiền thưởng | VietFresh Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/admin-accounts.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/admin-loyalty.css}">
</head>
<body class="loyalty-page">
<div class="app-shell">
    <header class="topbar">
        <a class="brand" th:href="@{/admin/accounts}" aria-label="VietFresh Hub, trung tâm quản trị"><span class="brand-mark" aria-hidden="true">V</span><span><strong>VietFresh Hub</strong><small>TRUNG TÂM QUẢN TRỊ</small></span></a>
        <div class="topbar-right"><span th:replace="~{fragments/notifications :: bell}"></span><span class="admin-label">QUẢN TRỊ VIÊN</span><span class="admin-avatar" aria-label="Quản trị viên">AD</span></div>
    </header>
<main class="page-content">
    <nav class="breadcrumbs" aria-label="Điều hướng"><a th:href="@{/admin/accounts}">Quản trị</a><span aria-hidden="true">/</span><strong>Quy tắc dùng tiền thưởng</strong></nav>
    <section class="page-heading"><div><p class="eyebrow">LOYALTY</p><h1>Cấu hình quy tắc dùng tiền thưởng</h1></div></section>
    <nav class="loyalty-nav" aria-label="Cấu hình tiền thưởng">
        <a th:href="@{/admin/loyalty-rules/earning}">Quy tắc tích thưởng</a>
        <a th:href="@{/admin/loyalty-rules/redemption}" aria-current="page">Quy tắc dùng tiền thưởng</a>
    </nav>

    <div class="accounts-panel loyalty-card">
        <div class="loyalty-card-body">
            <div th:if="${successMessage}" class="alert alert-success" role="status" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

            <form th:action="@{/admin/loyalty-rules/redemption}" th:object="${form}" method="post">
                <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="alert alert-danger" role="alert" th:if="${#fields.hasAnyErrors()}">
                    <strong>Vui lòng kiểm tra lại:</strong>
                    <ul class="mb-0 mt-2">
                        <li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li>
                    </ul>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="minRedemptionAmount" class="form-label fw-semibold">
                            Số tiền thưởng đổi tối thiểu <span class="text-danger">*</span>
                        </label>
                        <div class="input-group has-validation">
                            <input id="minRedemptionAmount" type="number" class="form-control"
                                   th:field="*{minRedemptionAmount}" th:errorclass="is-invalid"
                                   min="1" max="9999999999999999" step="1" placeholder="1000" required>
                            <span class="input-group-text">₫</span>
                            <div class="invalid-feedback" th:errors="*{minRedemptionAmount}"></div>
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="maxRedemptionPercent" class="form-label fw-semibold">
                            Phần trăm giảm tối đa <span class="text-danger">*</span>
                        </label>
                        <div class="input-group has-validation">
                            <input id="maxRedemptionPercent" type="number" class="form-control"
                                   th:field="*{maxRedemptionPercent}" th:errorclass="is-invalid"
                                   min="1" max="100" step="1" placeholder="20"
                                   required>
                            <span class="input-group-text">%</span>
                            <div class="invalid-feedback" th:errors="*{maxRedemptionPercent}"></div>
                        </div>
                    </div>
                </div>
                <div class="mb-4">
                    <div class="form-check form-switch">
                        <input id="redemptionEnabled" type="checkbox" role="switch" class="form-check-input"
                               th:field="*{redemptionEnabled}" th:errorclass="is-invalid">
                        <label for="redemptionEnabled" class="form-check-label fw-semibold">Bật dùng tiền thưởng</label>
                        <div class="invalid-feedback" th:errors="*{redemptionEnabled}"></div>
                    </div>
                </div>

                <div class="loyalty-actions">
                    <a th:href="@{/admin/accounts}" class="button">Hủy</a>
                    <button type="submit" class="button primary">Lưu</button>
                </div>
            </form>
        </div>
    </div>
</main>
</div>
</body>
</html>
