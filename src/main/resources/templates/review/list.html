<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Đánh giá · VietFresh Hub</title></head>
<body><main>
    <h1 th:text="${targetType == 'product' ? 'Đánh giá sản phẩm' : 'Đánh giá cửa hàng'}">Đánh giá</h1>
    <p th:text="${'Điểm trung bình: ' + (rating.averageRating == null ? 'Chưa có' : #numbers.formatDecimal(rating.averageRating,1,1)) + ' · ' + rating.ratingCount + ' đánh giá'}">Xếp hạng</p>
    <p><a th:href="@{/reviews/mine}" th:if="${canReview}">Quản lý đánh giá của tôi</a></p>
    <section th:if="${canReview and !#lists.isEmpty(eligiblePurchases)}">
        <h2>Đánh giá sau khi mua</h2>
        <form th:if="${targetType == 'product'}" method="post" th:action="@{/reviews/product/{id}(id=${targetId})}" th:object="${reviewForm}">
            <label for="orderItemId">Đơn hàng đã hoàn thành</label>
            <select id="orderItemId" name="orderItemId" required><option th:each="id : ${eligiblePurchases}" th:value="${id}" th:text="${'Dòng đơn hàng #' + id}"></option></select>
            <label for="rating-product">Điểm từ 1 đến 5</label><input id="rating-product" type="number" min="1" max="5" th:field="*{rating}" required>
            <label for="content-product">Nội dung (không bắt buộc)</label><textarea id="content-product" maxlength="3000" th:field="*{content}"></textarea>
            <button type="submit">Gửi đánh giá</button>
        </form>
        <form th:if="${targetType == 'shop'}" method="post" th:action="@{/reviews/shop/{id}(id=${targetId})}" th:object="${reviewForm}">
            <label for="shopOrderId">Đơn hàng đã hoàn thành</label>
            <select id="shopOrderId" name="shopOrderId" required><option th:each="id : ${eligiblePurchases}" th:value="${id}" th:text="${'Đơn cửa hàng #' + id}"></option></select>
            <label for="rating-shop">Điểm từ 1 đến 5</label><input id="rating-shop" type="number" min="1" max="5" th:field="*{rating}" required>
            <label for="content-shop">Nội dung (không bắt buộc)</label><textarea id="content-shop" maxlength="3000" th:field="*{content}"></textarea>
            <button type="submit">Gửi đánh giá</button>
        </form>
    </section>
    <p th:if="${canReview and #lists.isEmpty(eligiblePurchases)}">Chỉ tài khoản có đơn hoàn thành chưa được đánh giá mới có thể gửi đánh giá.</p>
    <p th:if="${#lists.isEmpty(reviews.content)}">Chưa có đánh giá được duyệt.</p>
    <article th:each="review : ${reviews.content}">
        <h2 th:text="${review.reviewerName + ' · ' + review.rating + '/5'}">Đánh giá</h2>
        <p th:text="${review.content}"></p><time th:text="${review.createdAt}"></time>
        <form th:if="${canReview}" method="post" th:action="@{/reviews/{id}/report(id=${review.reviewId})}" th:object="${reportForm}">
            <input type="hidden" name="returnTo" th:value="${'/reviews/' + targetType + '/' + targetId}">
            <label th:for="${'reason-' + review.reviewId}">Báo cáo đánh giá</label>
            <input th:id="${'reason-' + review.reviewId}" th:field="*{reason}" maxlength="100" placeholder="Lý do" required>
            <textarea th:field="*{description}" maxlength="1000" placeholder="Mô tả thêm (không bắt buộc)"></textarea>
            <button type="submit">Báo cáo</button>
        </form>
    </article>
    <nav th:if="${reviews.totalPages > 1}" aria-label="Trang đánh giá">
        <a th:if="${reviews.hasPrevious()}" th:href="@{/reviews/{type}/{id}(type=${targetType},id=${targetId},page=${reviews.number - 1})}">Trước</a>
        <span th:text="${reviews.number + 1 + ' / ' + reviews.totalPages}"></span>
        <a th:if="${reviews.hasNext()}" th:href="@{/reviews/{type}/{id}(type=${targetType},id=${targetId},page=${reviews.number + 1})}">Sau</a>
    </nav>
    <a th:href="@{/home}">Về trang chủ</a>
</main></body></html>
