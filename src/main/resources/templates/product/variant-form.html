<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

    <!-- Tài nguyên trang -->
    <head th:replace="~{fragments/product-inventory :: head('Phân loại sản phẩm','product')}">
    </head>

    <body class="vfo-app vfr-app vfr-product vfr-seller" data-vfr-section="product">

        <!-- Điều hướng Seller Portal -->
        <header th:replace="~{fragments/product-inventory :: nav('product')}">
        </header>

        <!-- Nội dung chính -->
        <div class="vf-workspace" id="order-content" tabindex="-1">
        <main class="container vf-main narrow vfr-page">
            <a
                class="d-inline-block mb-3 text-success text-decoration-none"
                th:href="@{/seller/products/{id}(id=${productId})}"
            >
                ← Chi tiết sản phẩm
            </a>
            <h1 th:text="${variantId==null?'Thêm phân loại':'Chỉnh sửa phân loại'}">
            </h1>
            <p class="text-body-secondary mb-2" th:text="${row.product.name}">
            </p>

            <!-- Biểu mẫu -->
            <form
                th:object="${form}"
                th:action="${variantId==null}?@{/seller/products/{id}/variants(id=${productId})}:@{/seller/products/{id}/variants/{v}/edit(id=${productId},v=${variantId})}"
                method="post"
                class="card p-4 form-stack"
            >
                <div th:replace="~{fragments/product-inventory :: errors}">
                </div>
                <div
                    class="variant-row"
                >
                    <h2 class="h5 mb-3">
                        Thông tin phân loại
                    </h2>
                    <th:block th:replace="~{fragments/variant-fields :: fields('', ${form}, ${variantId==null}, ${row.imageUrl}, ${null})}"></th:block>
                </div>
                <label class="form-label w-100 mt-3" for="reason">
                    Lý do thay đổi
                    <span class="text-danger">
                        *
                    </span>
                    <input
                        class="form-control mt-1"
                        id="reason"
                        th:field="*{reason}"
                        maxlength="900"
                        required
                    >
                </label>
                <div class="d-flex flex-wrap gap-2 mt-3">
                    <button type="submit" class="btn btn-success">
                        Lưu phân loại
                    </button>
                    <a class="btn btn-outline-secondary" th:href="@{/seller/products/{id}(id=${productId})}">
                        Hủy
                    </a>
                </div>
            </form>

        </main>


        </div>

        <script defer th:src="@{/js/product/product.js}"></script>
    <div class="vfr-product-footer"><footer th:replace="~{fragments/seller-orders :: footer}"></footer></div>
</body>
</html>
