<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

    <!-- Tài nguyên trang -->
    <head th:replace="~{fragments/product-inventory :: head('Không thể thực hiện thao tác','product')}">
    </head>

    <body class="vfo-app vfr-app vfr-product vfr-seller" data-vfr-section="product">

        <!-- Điều hướng Seller Portal -->
        <header th:replace="~{fragments/product-inventory :: nav('product')}">
        </header>

        <!-- Nội dung chính -->
        <div class="vf-workspace" id="order-content" tabindex="-1">
        <main class="container vf-main narrow vfr-page">

            <section class="card p-4">
                <h1 class="mb-3">
                    Không thể thực hiện thao tác
                </h1>
                <p class="alert alert-danger" role="alert" th:text="${message}">
                </p>
                <div class="d-flex flex-wrap gap-2">
                    <a class="btn btn-success" th:href="@{/seller/products}">
                        Danh sách sản phẩm
                    </a>
                    <a class="btn btn-outline-secondary" th:href="@{/seller/inventory}">
                        Quản lý tồn kho
                    </a>
                </div>
            </section>

        </main>

        </div>

    <div class="vfr-product-footer"><footer th:replace="~{fragments/seller-orders :: footer}"></footer></div>
</body>
</html>
