<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

    <!-- Tài nguyên trang -->
    <head th:replace="~{fragments/product-inventory :: head('Lịch sử giá bán','product')}">
    </head>

    <body class="vfo-app vfr-app vfr-product vfr-seller" data-vfr-section="product">

        <!-- Điều hướng Seller Portal -->
        <header th:replace="~{fragments/product-inventory :: nav('product')}">
        </header>

        <!-- Nội dung chính -->
        <div class="vf-workspace" id="order-content" tabindex="-1">
        <main class="container vf-main vfr-page">
            <a
                class="d-inline-block mb-3 text-success text-decoration-none"
                th:href="@{/seller/products/{id}(id=${productId})}"
            >
                ← Chi tiết sản phẩm
            </a>
            <h1>
                Lịch sử giá bán
            </h1>
            <div class="card mb-3">
                <div class="table-responsive" role="region" tabindex="0" aria-label="Lịch sử giá bán">

                    <!-- Bảng dữ liệu -->
                    <table class="table table-hover align-middle mb-0 vf-price-history-table" role="table">
                        <colgroup>
                            <col>
                            <col>
                            <col>
                            <col>
                        </colgroup>
                        <thead class="table-light">
                            <tr>
                                <th scope="col">
                                    Giá bán (₫)
                                </th>
                                <th scope="col">
                                    Hiệu lực từ (giờ Việt Nam)
                                </th>
                                <th scope="col">
                                    Hiệu lực đến
                                </th>
                                <th scope="col">
                                    Người cập nhật
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="e : ${events.content}">
                                <td
                                    data-label="Giá bán (₫)"
                                    class="fw-semibold text-success"
                                    th:text="${@vndAmounts.format(e.price)+' ₫'}"
                                >
                                </td>
                                <td
                                    data-label="Hiệu lực từ (giờ Việt Nam)"
                                    th:text="${#temporals.format(e.effectiveFrom.plusHours(7),'dd/MM/yyyy HH:mm:ss')}"
                                >
                                </td>
                                <td
                                    data-label="Hiệu lực đến"
                                    th:text="${e.effectiveTo==null?'Đang áp dụng':#temporals.format(e.effectiveTo.plusHours(7),'dd/MM/yyyy HH:mm:ss')}"
                                >
                                </td>
                                <td data-label="Người cập nhật" th:text="${e.changedBy==null?'Hệ thống':'#'+e.changedBy}">
                                </td>
                            </tr>
                            <tr th:if="${events.empty}">
                                <td colspan="4" class="text-center text-body-secondary py-5">
                                    Chưa có lịch sử giá bán.
                                </td>
                            </tr>
                        </tbody>
                    </table>

                </div>
            </div>

            <nav
                th:replace="~{fragments/product-inventory :: pagination(${events}, @{/seller/products/{id}/variants/{v}/prices(id=${productId},v=${variantId},page=${events.number})}, @{/seller/products/{id}/variants/{v}/prices(id=${productId},v=${variantId},page=${events.number+2})}, 'Phân trang lịch sử giá bán', '')}"
            >
            </nav>

        </main>

        </div>

    <div class="vfr-product-footer"><footer th:replace="~{fragments/seller-orders :: footer}"></footer></div>
</body>
</html>
