<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Quên mật khẩu | VietFresh Hub')}"></head>
<body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex flex-col">
<main class="w-full flex-1 grid place-items-center px-margin py-space-lg">
    <section class="w-full max-w-[480px] rounded-xl border border-outline-variant bg-surface-container-lowest p-space-lg shadow-sm">
        <a th:href="@{/login}" class="text-primary hover:underline">← Quay lại đăng nhập</a>
        <p class="mt-space-lg text-label-md text-primary font-semibold">KHÔI PHỤC TÀI KHOẢN</p>
        <h1 class="mt-2 text-3xl font-bold">Quên mật khẩu?</h1>
        <p class="mt-2 text-on-surface-variant">Nhập email đã xác minh. Nếu tài khoản phù hợp, chúng tôi sẽ gửi liên kết đặt lại mật khẩu.</p>

        <div th:if="${successMessage}" class="mt-space-md rounded-lg bg-green-50 px-4 py-3 text-green-800" role="status" th:text="${successMessage}"></div>

        <form th:action="@{/forgot-password}" th:object="${forgotPasswordForm}" method="post" class="mt-space-lg space-y-space-md">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div>
                <label for="email" class="mb-1 block font-semibold">Email</label>
                <input id="email" type="email" th:field="*{email}" maxlength="255" required autocomplete="email"
                       class="w-full rounded-lg border border-outline-variant px-4 py-3 focus:border-primary focus:outline-none">
                <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="mt-1 text-sm text-red-700"></p>
            </div>
            <button type="submit" class="w-full rounded-lg bg-primary px-5 py-3 font-semibold text-on-primary">Gửi hướng dẫn</button>
        </form>
    </section>
</main>
</body>
</html>
