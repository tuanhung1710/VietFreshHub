<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Đặt lại mật khẩu | VietFresh Hub')}"></head>
<body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex flex-col">
<main class="w-full flex-1 grid place-items-center px-margin py-space-lg">
    <section class="w-full max-w-[480px] rounded-xl border border-outline-variant bg-surface-container-lowest p-space-lg shadow-sm">
        <a th:href="@{/login}" class="text-primary hover:underline">← Quay lại đăng nhập</a>
        <p class="mt-space-lg text-label-md text-primary font-semibold">KHÔI PHỤC TÀI KHOẢN</p>
        <h1 class="mt-2 text-3xl font-bold">Tạo mật khẩu mới</h1>
        <p class="mt-2 text-on-surface-variant">Mật khẩu mới cần có từ 8 đến 100 ký tự.</p>

        <div th:if="${errorMessage}" class="mt-space-md rounded-lg bg-red-50 px-4 py-3 text-red-800" role="alert" th:text="${errorMessage}"></div>
        <form th:action="@{/reset-password}" th:object="${resetPasswordForm}" method="post" class="mt-space-lg space-y-space-md">
            <div th:if="${#fields.hasGlobalErrors()}" class="rounded-lg bg-red-50 p-3 text-red-800" role="alert">
                <p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
            </div>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" th:field="*{token}">
            <div>
                <label for="newPassword" class="mb-1 block font-semibold">Mật khẩu mới</label>
                <input id="newPassword" type="password" th:field="*{newPassword}" minlength="8" maxlength="100" required autocomplete="new-password"
                       class="w-full rounded-lg border border-outline-variant px-4 py-3 focus:border-primary focus:outline-none">
                <p th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}" class="mt-1 text-sm text-red-700"></p>
            </div>
            <div>
                <label for="confirmPassword" class="mb-1 block font-semibold">Xác nhận mật khẩu mới</label>
                <input id="confirmPassword" type="password" th:field="*{confirmPassword}" maxlength="100" required autocomplete="new-password"
                       class="w-full rounded-lg border border-outline-variant px-4 py-3 focus:border-primary focus:outline-none">
                <p th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="mt-1 text-sm text-red-700"></p>
            </div>
            <p th:if="${#fields.hasErrors('token')}" th:errors="*{token}" class="text-sm text-red-700"></p>
            <button type="submit" class="w-full rounded-lg bg-primary px-5 py-3 font-semibold text-on-primary">Đặt lại mật khẩu</button>
        </form>
        <p class="mt-space-md text-sm text-on-surface-variant">Liên kết không hợp lệ hoặc đã hết hạn? <a th:href="@{/forgot-password}" class="text-primary hover:underline">Yêu cầu liên kết mới</a>.</p>
    </section>
</main>
</body>
</html>
