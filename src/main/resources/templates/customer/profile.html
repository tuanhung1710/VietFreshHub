<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thông tin cá nhân | VietFresh Hub</title>
    <th:block th:replace="~{fragments/interface-layout :: foundation}"></th:block>
    <th:block th:replace="~{fragments/interface-layout :: styles}"></th:block>
    <link rel="stylesheet" th:href="@{/css/customer-profile.css}">
</head>
<body class="vfo-app vfr-app vfc-app vfr-customer vfc-workspace-page customer-profile-page" data-vfr-section="account">
<th:block th:replace="~{fragments/interface-layout :: customerHeader('profile')}"></th:block>
<div class="vfo-workspace" id="workspace-content" tabindex="-1">
<main class="vfr-page" id="customer-content" tabindex="-1">
    <header class="vfo-page-heading customer-profile-heading">
        <div>
            <h1>Thông tin cá nhân</h1>
            <p class="vfo-page-description">Quản lý thông tin liên hệ và ảnh đại diện của bạn.</p>
        </div>
        <div class="customer-profile-links">
            <a class="btn vfo-btn-secondary" th:href="@{/customer/addresses}">Quản lý địa chỉ giao hàng</a>
            <a class="btn vfo-btn-secondary" th:href="@{/customer/password}">Đổi mật khẩu</a>
        </div>
    </header>

    <div th:if="${successMessage}" class="alert alert-success" role="status" th:text="${successMessage}"></div>

    <form th:action="@{/customer/profile}" th:object="${profile}" method="post" enctype="multipart/form-data"
          class="card customer-profile-form" aria-labelledby="profile-form-heading">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="vfo-card-heading">
            <svg class="vfo-icon" aria-hidden="true"><use href="#vfo-user"/></svg>
            <h2 id="profile-form-heading">Thông tin tài khoản</h2>
        </div>
        <div class="customer-profile-body">
            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" role="alert">
                <p class="mb-0" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
            </div>

            <div id="avatarPreviewContainer" class="customer-profile-avatar-row">
                <img th:if="${profile.avatarUrl != null and !#strings.isEmpty(profile.avatarUrl)}"
                     id="avatarPreview" th:src="${profile.avatarUrl}" alt="Ảnh đại diện hiện tại"
                     class="customer-profile-avatar" width="88" height="88">
                <span th:unless="${profile.avatarUrl != null and !#strings.isEmpty(profile.avatarUrl)}"
                      id="avatarFallback" class="customer-profile-avatar"
                      th:text="${#strings.isEmpty(profile.fullName) ? '?' : #strings.substring(profile.fullName, 0, 1)}">A</span>
                <div class="customer-profile-upload">
                    <label for="avatarFile" class="form-label">Ảnh đại diện</label>
                    <input id="avatarFile" name="avatarFile" type="file" accept="image/jpeg,image/png"
                           class="form-control" aria-describedby="avatarHelp">
                    <p id="avatarHelp" class="form-text">Chọn ảnh JPG hoặc PNG, tối đa 5 MB. Bỏ trống nếu không muốn đổi ảnh.</p>
                </div>
            </div>

            <div class="customer-profile-fields">
                <div class="customer-profile-field customer-profile-email">
                    <label for="email" class="form-label">Email</label>
                    <input id="email" type="email" th:value="${profile.email}" readonly
                           class="form-control" aria-describedby="emailHelp">
                    <p id="emailHelp" class="form-text">Email hiện chưa thể thay đổi tại trang này.</p>
                </div>
                <div class="customer-profile-field">
                    <label for="fullName" class="form-label">Họ và tên</label>
                    <input id="fullName" type="text" th:field="*{fullName}" maxlength="150" required
                           autocomplete="name" class="form-control" aria-describedby="fullNameError"
                           th:attr="aria-invalid=${#fields.hasErrors('fullName')}">
                    <p id="fullNameError" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"
                       class="invalid-feedback d-block"></p>
                </div>
                <div class="customer-profile-field">
                    <label for="phone" class="form-label">Số điện thoại</label>
                    <input id="phone" type="tel" th:field="*{phone}" maxlength="10" inputmode="numeric"
                           pattern="[0-9]{10}" title="Nếu nhập số điện thoại, vui lòng nhập đúng 10 chữ số."
                           autocomplete="tel"
                           class="form-control" aria-describedby="phoneError"
                           th:attr="aria-invalid=${#fields.hasErrors('phone')}">
                    <p id="phoneError" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"
                       class="invalid-feedback d-block"></p>
                </div>
            </div>
        </div>
        <div class="customer-profile-actions">
            <a class="btn vfo-btn-secondary" th:href="@{/customer/home}">Hủy</a>
            <button type="submit" class="btn vfo-btn-primary">Lưu thay đổi</button>
        </div>
    </form>
</main>


<script>
    (() => {
        const avatarInput = document.getElementById('avatarFile');
        const previewContainer = document.getElementById('avatarPreviewContainer');
        const fallback = document.getElementById('avatarFallback');
        let previewUrl = null;

        if (!avatarInput || !previewContainer) return;

        avatarInput.addEventListener('change', () => {
            const file = avatarInput.files && avatarInput.files[0];
            if (!file) return;

            const nextPreviewUrl = URL.createObjectURL(file);
            let preview = document.getElementById('avatarPreview');

            if (!preview) {
                preview = document.createElement('img');
                preview.id = 'avatarPreview';
                preview.alt = 'Ảnh đại diện xem trước';
                preview.className = 'customer-profile-avatar';
                previewContainer.prepend(preview);
            }

            preview.src = nextPreviewUrl;
            preview.alt = 'Ảnh đại diện xem trước';
            if (fallback) fallback.hidden = true;

            if (previewUrl) URL.revokeObjectURL(previewUrl);
            previewUrl = nextPreviewUrl;
        });

        window.addEventListener('beforeunload', () => {
            if (previewUrl) URL.revokeObjectURL(previewUrl);
        });
    })();
</script>
<footer th:replace="~{fragments/customer-service :: footer}"></footer>
</div>
</body>
</html>
