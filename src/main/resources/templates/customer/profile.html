<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/interface-layout :: head('Thông tin cá nhân | VietFresh Hub')}"></head>
<body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex flex-col vfo-app vfr-app vfr-utility vfc-app vfr-customer" data-vfr-section="account">
<th:block th:replace="~{fragments/interface-layout :: navigation('customer','account')}"></th:block>



<main class="w-full pt-20 bg-surface flex-1 vfr-page" id="customer-content" tabindex="-1">
    <section class="max-w-[960px] mx-auto px-margin py-space-lg">
        <a th:href="@{/customer/home}" class="text-primary hover:underline">← Trang khách hàng</a>
        <div class="mt-space-md mb-space-lg">
            <h1 class="mt-2 text-3xl font-bold">Thông tin cá nhân</h1>
        </div>

        <div th:if="${successMessage}" class="mb-space-md rounded-lg bg-green-50 px-4 py-3 text-green-800" role="status" th:text="${successMessage}"></div>

        <div class="mb-space-md grid gap-3 sm:grid-cols-2">
            <a th:href="@{/customer/addresses}" class="rounded-xl border border-outline-variant bg-surface-container-lowest p-space-md font-semibold hover:border-primary">
                Quản lý địa chỉ giao hàng →
            </a>
            <a th:href="@{/customer/password}" class="rounded-xl border border-outline-variant bg-surface-container-lowest p-space-md font-semibold hover:border-primary">
                Đổi mật khẩu →
            </a>
        </div>

        <form th:action="@{/customer/profile}" th:object="${profile}" method="post" enctype="multipart/form-data"
              class="rounded-xl border border-outline-variant bg-surface-container-lowest p-space-lg shadow-sm">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div th:if="${#fields.hasGlobalErrors()}" class="mb-space-md rounded-lg bg-red-50 p-3 text-sm text-red-800" role="alert">
                <p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
            </div>

            <div id="avatarPreviewContainer" class="mb-space-lg flex flex-wrap items-center gap-4">
                <img th:if="${profile.avatarUrl != null and !#strings.isEmpty(profile.avatarUrl)}"
                     id="avatarPreview" th:src="${profile.avatarUrl}" alt="Ảnh đại diện hiện tại"
                     class="h-20 w-20 rounded-full border border-outline-variant object-cover">
                <span th:unless="${profile.avatarUrl != null and !#strings.isEmpty(profile.avatarUrl)}"
                      id="avatarFallback"
                      class="grid h-20 w-20 place-items-center rounded-full bg-surface-container text-2xl font-bold text-primary"
                      th:text="${#strings.substring(profile.fullName, 0, 1)}">A</span>
                <div>
                    <label for="avatarFile" class="mb-1 block font-semibold">Ảnh đại diện</label>
                    <input id="avatarFile" name="avatarFile" type="file" accept="image/jpeg,image/png"
                           class="block max-w-full text-sm file:mr-3 file:rounded-lg file:border-0 file:bg-surface-container file:px-3 file:py-2">
                    <p class="mt-1 text-sm text-on-surface-variant">Chọn ảnh JPG hoặc PNG, tối đa 5 MB. Bỏ trống nếu không muốn đổi ảnh.</p>
                </div>
            </div>

            <div class="mb-space-md">
                <label for="email" class="mb-2 block font-semibold">Email</label>
                <input id="email" type="email" th:value="${profile.email}" readonly
                       class="w-full rounded-lg border border-outline-variant bg-surface-container-low px-4 py-3 text-on-surface-variant">
                <p class="mt-1 text-sm text-on-surface-variant">Email hiện chưa thể thay đổi tại trang này.</p>
            </div>

            <div class="mb-space-md">
                <label for="fullName" class="mb-2 block font-semibold">Họ và tên</label>
                <input id="fullName" type="text" th:field="*{fullName}" maxlength="150" required
                       autocomplete="name"
                       class="w-full rounded-lg border border-outline-variant bg-surface px-4 py-3 focus:border-primary focus:outline-none">
                <p th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="mt-1 text-sm text-red-700"></p>
            </div>

            <div class="mb-space-lg">
                <label for="phone" class="mb-2 block font-semibold">Số điện thoại</label>
                <input id="phone" type="tel" th:field="*{phone}" maxlength="30" autocomplete="tel"
                       class="w-full rounded-lg border border-outline-variant bg-surface px-4 py-3 focus:border-primary focus:outline-none">
                <p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="mt-1 text-sm text-red-700"></p>
            </div>

            <div class="flex flex-wrap items-center gap-3">
                <button type="submit" class="rounded-lg bg-primary px-5 py-3 font-semibold text-on-primary hover:opacity-90">
                    Lưu thay đổi
                </button>
                <a th:href="@{/customer/home}" class="rounded-lg border border-outline-variant px-5 py-3 font-semibold hover:bg-surface-container">
                    Hủy
                </a>
            </div>
        </form>
    </section>
</main>


<script>
    (() => {
        const avatarInput = document.getElementById('avatarFile');
        const previewContainer = document.getElementById('avatarPreviewContainer');
        const fallback = document.getElementById('avatarFallback');
        let previewUrl = null;

        if (!avatarInput || !previewContainer) return;

        avatarInput.addEventListener('change', () => {
            const file = avatarInput.files && avatarInput.files[0];
            if (!file) return;

            const nextPreviewUrl = URL.createObjectURL(file);
            let preview = document.getElementById('avatarPreview');

            if (!preview) {
                preview = document.createElement('img');
                preview.id = 'avatarPreview';
                preview.alt = 'Ảnh đại diện xem trước';
                preview.className = 'h-20 w-20 rounded-full border border-outline-variant object-cover';
                previewContainer.prepend(preview);
            }

            preview.src = nextPreviewUrl;
            preview.alt = 'Ảnh đại diện xem trước';
            if (fallback) fallback.classList.add('hidden');

            if (previewUrl) URL.revokeObjectURL(previewUrl);
            previewUrl = nextPreviewUrl;
        });

        window.addEventListener('beforeunload', () => {
            if (previewUrl) URL.revokeObjectURL(previewUrl);
        });
    })();
</script>
<footer th:replace="~{fragments/customer-service :: footer}"></footer>
</body>
</html>
