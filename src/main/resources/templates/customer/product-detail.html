<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/customer-shop :: head(${product.name})}"></head>
<body class="shopfront">
<header th:replace="~{fragments/customer-shop :: header}"></header>
<main class="sf-wrap sf-main">
    <p class="sf-muted"><a th:href="@{/home}">Sản phẩm</a> / <a th:href="@{/shops/{id}(id=${product.shopId})}" th:text="${product.shopName}"></a></p>
    <div th:replace="~{fragments/customer-shop :: messages}"></div>
    <article class="sf-detail">
        <img class="sf-detail-image" th:src="${product.imageUrl}" th:alt="${product.name}" width="560" height="560">
        <section class="sf-panel">
            <p class="sf-kicker"><a th:href="@{/shops/{id}(id=${product.shopId})}" th:text="${product.shopName}"></a></p>
            <h1 th:text="${product.name}"></h1>
            <p class="sf-description sf-muted" th:text="${product.description}"></p>
            <p class="sf-price" th:text="${#numbers.formatInteger(selectedVariant.price,0,'POINT')} + ' ₫'"></p>
            <p class="sf-muted" th:if="${selectedVariant.basePrice > selectedVariant.price}">Giá gốc <del th:text="${#numbers.formatInteger(selectedVariant.basePrice,0,'POINT')} + ' ₫'"></del> · Ưu đãi theo lô</p>
            <h2>Chọn phân loại</h2>
            <div class="sf-variants" aria-label="Phân loại đang bán">
                <a th:each="variant : ${variants}" th:classappend="${variant.variantId == variantId} ? 'selected'" th:aria-current="${variant.variantId == variantId} ? 'true' : 'false'"
                   th:href="@{/product-detail/{id}(id=${variant.variantId})}" th:text="${variant.variantName}"></a>
            </div>
            <form th:if="${#authorization.expression('hasRole(''CUSTOMER'')')}" method="post" th:action="@{/cart/add}" class="sf-buy">
                <input type="hidden" name="variantId" th:value="${variantId}"><input type="hidden" name="redirect" value="detail">
                <label>Số lượng <input type="number" name="quantity" min="1" th:max="${availableStock}" th:value="${requestedQuantity != null ? requestedQuantity : 1}" required></label>
                <button class="sf-button">Thêm vào giỏ hàng</button>
            </form>
            <p th:if="${#authorization.expression('!isAuthenticated()')}"><a class="sf-button" th:href="@{/login}">Đăng nhập để mua hàng</a></p>
            <p th:if="${#authorization.expression('isAuthenticated() and !hasRole(''CUSTOMER'')')}" class="sf-muted">Mua hàng bằng tài khoản khách hàng.</p>
            <p class="sf-muted"><a th:href="@{/shops/{id}/products(id=${product.shopId})}">Xem thêm sản phẩm của cửa hàng →</a></p>
        </section>
    </article>
</main>
<footer th:replace="~{fragments/customer-shop :: footer}"></footer>
</body>
</html>
