<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/storefront :: head('Thanh toán VNPAY')}"></head><body>
<header th:replace="~{fragments/storefront :: header}"></header>
<main class="container page">
    <h1>Thanh toán VNPAY</h1>
    <div th:replace="~{fragments/storefront :: messages}"></div>
    <section class="panel" id="vnpay-payment" th:attr="data-status-url=@{/customer/payments/orders/{id}/status(id=${payment.orderId})},data-status=${payment.status}">
        <h2 th:text="${payment.orderCode}"></h2>
        <p>Tổng thanh toán: <strong class="price" th:text="${#numbers.formatDecimal(payment.amount,0,'POINT',2,'COMMA')} + ' ₫'"></strong></p>
        <p role="status" data-payment-message th:text="${payment.message}"></p>
        <p class="muted">Hạn thanh toán: <span th:text="${#temporals.format(payment.expiresAt,'dd/MM/yyyy HH:mm:ss')}"></span> (giờ Việt Nam).</p>
        <form th:if="${payment.canPay}" th:action="@{/customer/payments/orders/{id}/pay(id=${payment.orderId})}" method="post">
            <button class="button" type="submit">Tiếp tục thanh toán qua VNPAY</button>
        </form>
        <p><a class="button secondary" th:href="@{/customer/payments/orders/{id}(id=${payment.orderId})}">Kiểm tra lại trạng thái</a></p>
        <a th:href="@{/customer/orders/{id}(id=${payment.orderId})}">Xem chi tiết đơn hàng</a>
        <p class="muted">Nếu tài khoản đã bị trừ tiền nhưng chưa thấy xác nhận, vui lòng kiểm tra lại trạng thái trước khi trả thêm.</p>
    </section>
</main><footer th:replace="~{fragments/storefront :: footer}"></footer>
<script defer th:src="@{/js/vnpay-payment.js}"></script></body></html>
