<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Đổi mật khẩu | VietFresh Hub')}"></head>
<body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex flex-col">
<div th:replace="~{fragments/header :: header}"></div>

<main class="w-full pt-20 bg-surface flex-1">
    <section class="max-w-[720px] mx-auto px-margin py-space-lg">
        <a th:href="@{/customer/profile}" class="text-primary hover:underline">← Hồ sơ của tôi</a>
        <div class="mt-space-md mb-space-lg">
            <p class="text-label-md text-primary font-semibold">TÀI KHOẢN CỦA TÔI</p>
            <h1 class="mt-2 text-3xl font-bold">Đổi mật khẩu</h1>
            <p class="mt-2 text-on-surface-variant">Nhập mật khẩu hiện tại và xác nhận mật khẩu mới.</p>
        </div>

        <div th:if="${googleLogin}" class="rounded-xl border border-outline-variant bg-surface-container-lowest p-space-lg text-on-surface-variant" role="status">
            Bạn đăng nhập bằng Google. Mật khẩu do Google quản lý và không thể đổi tại VietFresh Hub.
        </div>

        <form th:unless="${googleLogin}" th:action="@{/customer/password}" th:object="${passwordForm}" method="post"
              class="rounded-xl border border-outline-variant bg-surface-container-lowest p-space-lg shadow-sm">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div th:if="${#fields.hasGlobalErrors()}" class="mb-4 rounded-lg bg-red-50 p-3 text-sm text-red-800" role="alert">
                <p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
            </div>

            <div class="mb-space-md">
                <label for="currentPassword" class="mb-2 block font-semibold">Mật khẩu hiện tại</label>
                <input id="currentPassword" type="password" th:field="*{currentPassword}" required autocomplete="current-password"
                       class="w-full rounded-lg border border-outline-variant px-4 py-3 focus:border-primary focus:outline-none">
                <p th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}" class="mt-1 text-sm text-red-700"></p>
            </div>
            <div class="mb-space-md">
                <label for="newPassword" class="mb-2 block font-semibold">Mật khẩu mới</label>
                <input id="newPassword" type="password" th:field="*{newPassword}" minlength="8" maxlength="100" required autocomplete="new-password"
                       class="w-full rounded-lg border border-outline-variant px-4 py-3 focus:border-primary focus:outline-none">
                <p class="mt-1 text-sm text-on-surface-variant">Mật khẩu có từ 8 đến 100 ký tự.</p>
                <p th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}" class="mt-1 text-sm text-red-700"></p>
            </div>
            <div class="mb-space-lg">
                <label for="confirmPassword" class="mb-2 block font-semibold">Xác nhận mật khẩu mới</label>
                <input id="confirmPassword" type="password" th:field="*{confirmPassword}" required autocomplete="new-password"
                       class="w-full rounded-lg border border-outline-variant px-4 py-3 focus:border-primary focus:outline-none">
                <p th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="mt-1 text-sm text-red-700"></p>
            </div>
            <div class="flex flex-wrap gap-3">
                <button type="submit" class="rounded-lg bg-primary px-5 py-3 font-semibold text-on-primary">Cập nhật mật khẩu</button>
                <a th:href="@{/customer/profile}" class="rounded-lg border border-outline-variant px-5 py-3 font-semibold">Hủy</a>
            </div>
        </form>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
