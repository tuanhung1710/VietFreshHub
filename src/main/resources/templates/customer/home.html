<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/customer-shop :: head('Sản phẩm')}"></head>
<body class="shopfront">
<header th:replace="~{fragments/customer-shop :: header}"></header>
<main class="sf-wrap sf-main">
    <div th:replace="~{fragments/customer-shop :: messages}"></div>
    <div class="sf-heading">
        <div><p class="sf-kicker">CHỌN TRÁI CÂY CỦA BẠN</p>
            <h1 th:text="${catalogShop != null ? catalogShop.shopName : 'Sản phẩm đang bán'}"></h1>
            <p class="sf-muted" th:if="${catalogShop != null}"><a th:href="@{/shops/{id}(id=${catalogShop.shopId})}">Xem thông tin cửa hàng →</a></p>
            <p class="sf-muted" th:unless="${catalogShop != null}">Tìm sản phẩm, chọn phân loại và cửa hàng phù hợp.</p>
        </div>
        <span class="sf-muted" th:text="${productPage.totalElements} + ' sản phẩm'"></span>
    </div>
    <form class="sf-filters" method="get" th:action="@{/home}" th:object="${filter}">
        <input type="hidden" th:field="*{categoryId}"><input type="hidden" th:field="*{shopId}">
        <label class="sf-search">Tên sản phẩm <input type="search" th:field="*{keyword}" placeholder="Bạn muốn tìm trái cây gì?" maxlength="100"></label>
        <label>Giá từ <input class="sf-price-input" type="number" th:field="*{minPrice}" min="0" step="1" placeholder="₫"></label>
        <label>Đến <input class="sf-price-input" type="number" th:field="*{maxPrice}" min="0" step="1" placeholder="₫"></label>
        <label>Sắp xếp <select th:field="*{sort}">
            <option value="newest">Mới nhất</option><option value="price_asc">Giá tăng dần</option><option value="price_desc">Giá giảm dần</option>
            <option value="best_selling">Bán chạy nhất</option><option value="rating">Đánh giá cao nhất</option>
        </select></label>
        <button class="sf-button">Áp dụng</button>
        <a class="sf-muted" th:href="@{/home(shopId=${filter.shopId})}">Xóa bộ lọc</a>
        <ul th:if="${#fields.hasAnyErrors()}" class="sf-notice error"><li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li></ul>
    </form>
    <nav class="sf-chips" aria-label="Danh mục sản phẩm">
        <a th:href="${filter.urlForCategory(null)}" th:classappend="${filter.categoryId == null} ? 'active'">Tất cả</a>
        <a th:each="category : ${categories}" th:href="${filter.urlForCategory(category.categoryId)}" th:classappend="${filter.categoryId == category.categoryId} ? 'active'" th:text="${category.name}"></a>
    </nav>
    <section th:if="${#lists.isEmpty(products)}" class="sf-empty">
        <h2>Không tìm thấy sản phẩm phù hợp</h2><p class="sf-muted">Thử tên sản phẩm hoặc khoảng giá khác.</p>
        <a class="sf-button secondary" th:href="@{/home(shopId=${filter.shopId})}">Xem tất cả sản phẩm</a>
    </section>
    <div class="sf-grid" aria-label="Sản phẩm đang bán"><th:block th:each="product : ${products}"><article th:replace="~{fragments/customer-shop :: productCard(${product})}"></article></th:block></div>
    <nav th:if="${productPage.totalPages > 1}" class="sf-pagination" aria-label="Phân trang sản phẩm">
        <a th:if="${productPage.hasPrevious()}" th:href="${filter.urlForPage(productPage.number)}">← Trang trước</a>
        <span class="sf-muted" th:text="${productPage.number + 1} + ' / ' + ${productPage.totalPages}"></span>
        <a th:if="${productPage.hasNext()}" th:href="${filter.urlForPage(productPage.number + 2)}">Trang tiếp →</a>
    </nav>
</main>
<footer th:replace="~{fragments/customer-shop :: footer}"></footer>
</body>
</html>
