<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/customer-shop :: head('Danh sách gian hàng')}">
    </head>
    <body class="vfo-app vfr-app vfr-retail vfr-customer" data-vfr-section="account">
        <header th:replace="~{fragments/customer-shop :: header}">
        </header>
        <main class="container vfr-page" id="shopspage">
            <div class="bread">
                <a th:href="@{/home}">
                    Trang chủ
                </a>
                / Gian hàng
            </div>
            <h1>
                Danh sách gian hàng
            </h1>
            <div class="shopgrid" id="shoplist">
                <th:block th:each="shop : ${shops}">
                    <a th:replace="~{fragments/storefront-catalog :: shopCard(${shop})}">
                    </a>
                </th:block>
                <p class="empty-products" th:if="${#lists.isEmpty(shops)}">
                    Chưa có gian hàng đang mở.
                </p>
            </div>
        </main>
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </body>
</html>
