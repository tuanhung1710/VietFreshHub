<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/shop-layout :: head(${shop.shopName})}">
    </head>
    <body class="vfo-app vfr-app vfr-retail vfr-customer" data-vfr-section="account">
        <header th:replace="~{fragments/shop-layout :: header}">
        </header>
        <main class="wrap vfr-page">
            <th:block th:replace="~{fragments/shop-layout :: shopInformation}">
            </th:block>
            <div th:replace="~{fragments/customer-shop :: messages}">
            </div>
            <!-- Các nhóm sản phẩm của cửa hàng. -->
            <div id="shopHome">
                <section class="section">
                    <div class="sectionhead">
                        <h2>
                            ĐỀ XUẤT CHO BẠN
                        </h2>
                        <a class="button" th:href="@{/shops/{id}/products(id=${shop.shopId})}">
                            Xem tất cả →
                        </a>
                    </div>
                    <div class="products" id="recommended">
                        <th:block th:each="product : ${recommended}">
                            <a th:replace="~{fragments/storefront-catalog :: shopProductCard(${product},null)}">
                            </a>
                        </th:block>
                        <p class="empty-products" th:if="${#lists.isEmpty(recommended)}">
                            Shop chưa có sản phẩm đang được bán.
                        </p>
                    </div>
                </section>
                <section class="section">
                    <div class="sectionhead">
                        <h2>
                            TOP PRODUCTS
                        </h2>
                        <a class="button" th:href="@{/shops/{id}/products(id=${shop.shopId},sort='sales')}">
                            Xem tất cả →
                        </a>
                    </div>
                    <div class="products" id="topProducts">
                        <th:block th:each="product,iter : ${topProducts}">
                            <a th:replace="~{fragments/storefront-catalog :: shopProductCard(${product},${iter.count})}">
                            </a>
                        </th:block>
                        <p class="empty-products" th:if="${#lists.isEmpty(topProducts)}">
                            Shop chưa có sản phẩm đang được bán.
                        </p>
                    </div>
                </section>
            </div>
        </main>
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </body>
</html>
