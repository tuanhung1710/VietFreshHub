<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/customer-shop :: head('Cửa hàng đã lưu')}"></head>
<body class="vfo-app vfr-app vfr-retail vfr-customer" data-vfr-section="account">
<header th:replace="~{fragments/customer-shop :: header}"></header>
<main class="container vfr-page">
    <div class="bread"><a th:href="@{/home}">Trang chủ</a> / <a th:href="@{/shops}">Gian hàng</a> / Đã lưu</div>
    <h1>Cửa hàng đã lưu</h1>
    <div th:replace="~{fragments/customer-shop :: messages}"></div>
    <p th:if="${shopsPage.empty}">Bạn chưa lưu cửa hàng nào.</p>
    <div class="shopgrid">
        <article class="shop" th:each="shop : ${shopsPage.content}">
            <h3><a th:href="@{/shops/{id}(id=${shop.shopId})}" th:text="${shop.shopName}"></a></h3>
            <p th:text="${shop.description}"></p>
            <p><a th:href="@{/shops/{id}(id=${shop.shopId})}">Xem gian hàng</a></p>
            <form method="post" th:action="@{/shops/{id}/favorite(id=${shop.shopId})}">
                <input type="hidden" name="favorite" value="false"><button class="btn btn-success">Bỏ lưu</button>
            </form>
        </article>
    </div>
    <nav class="pagination" th:if="${shopsPage.totalPages > 1}" aria-label="Phân trang cửa hàng đã lưu">
        <a th:if="${shopsPage.hasPrevious()}" th:href="@{/customer/favorite-shops(page=${shopsPage.number})}">Trang trước</a>
        <span th:text="${shopsPage.number + 1} + ' / ' + ${shopsPage.totalPages}"></span>
        <a th:if="${shopsPage.hasNext()}" th:href="@{/customer/favorite-shops(page=${shopsPage.number + 2})}">Trang tiếp</a>
    </nav>
</main>
<footer th:replace="~{fragments/customer-shop :: footer}"></footer>
</body>
</html>
