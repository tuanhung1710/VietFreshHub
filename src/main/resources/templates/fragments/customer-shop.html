<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title th:text="${title} + ' · VietFresh Hub'"></title><link rel="stylesheet" th:href="@{/css/customer-shop.css}">
</head>
<body>
<header th:fragment="header" class="sf-header">
    <nav class="sf-wrap sf-nav" aria-label="Điều hướng mua sắm">
        <a class="sf-brand" th:href="@{/home}"><span class="sf-mark" aria-hidden="true">VF</span> VietFresh Hub</a>
        <div class="sf-links">
            <a th:href="@{/home}">Sản phẩm</a><a th:href="@{/shops}">Cửa hàng</a>
            <a th:if="${#authorization.expression('hasRole(''CUSTOMER'')')}" th:href="@{/customer/favorite-shops}">Đã lưu</a>
            <a th:if="${#authorization.expression('hasRole(''CUSTOMER'')')}" th:href="@{/cart}">Giỏ hàng</a>
            <a th:if="${#authorization.expression('hasRole(''CUSTOMER'')')}" th:href="@{/customer/profile}">Tài khoản</a>
            <a th:if="${#authorization.expression('!isAuthenticated()')}" th:href="@{/login}">Đăng nhập</a>
        </div>
    </nav>
</header>
<div th:fragment="messages" aria-live="polite">
    <p th:if="${successMessage}" class="sf-notice" role="status" th:text="${successMessage}"></p>
    <p th:if="${errorMessage}" class="sf-notice error" role="alert" th:text="${errorMessage}"></p>
</div>
<article th:fragment="productCard(product)" class="sf-card">
    <a class="sf-card-image" th:href="@{/product-detail(productId=${product.productId})}"><img th:src="${product.imageUrl}" th:alt="${product.name}" loading="lazy" width="320" height="240"></a>
    <div class="sf-card-body">
        <p class="sf-muted"><a th:href="@{/shops/{id}(id=${product.shopId})}" th:text="${product.shopName}"></a></p>
        <h3><a th:href="@{/product-detail(productId=${product.productId})}" th:text="${product.name}"></a></h3>
        <p class="sf-muted" th:text="${product.selectedVariant.variantName}"></p>
        <div class="sf-card-bottom"><span class="sf-price" th:text="${#numbers.formatInteger(product.selectedVariant.price,0,'POINT')} + ' ₫'"></span>
            <a th:href="@{/product-detail(productId=${product.productId})}">Chọn mua →</a></div>
    </div>
</article>
<section th:fragment="shopHeader(shop,active)" class="sf-shop-intro">
    <p class="sf-kicker">CỬA HÀNG</p>
    <div class="sf-shop-title">
        <img th:if="${shop.logoUrl != null and !#strings.isEmpty(shop.logoUrl)}" class="sf-avatar" th:src="${shop.logoUrl}" th:alt="${shop.shopName}">
        <span th:unless="${shop.logoUrl != null and !#strings.isEmpty(shop.logoUrl)}" class="sf-avatar sf-avatar-letter" aria-hidden="true" th:text="${#strings.substring(shop.shopName,0,1)}"></span>
        <div><h1 th:text="${shop.shopName}"></h1><p class="sf-muted" th:text="${shop.shopCode}"></p></div>
    </div>
    <nav class="sf-tabs" aria-label="Khám phá cửa hàng">
        <a th:classappend="${active == 'profile'} ? 'active'" th:href="@{/shops/{id}(id=${shop.shopId})}">Cửa hàng</a>
        <a th:href="@{/shops/{id}/products(id=${shop.shopId})}">Sản phẩm</a>
        <a th:classappend="${active == 'reviews'} ? 'active'" th:href="@{/shops/{id}/reviews(id=${shop.shopId})}">Đánh giá</a>
        <a th:classappend="${active == 'offers'} ? 'active'" th:href="@{/shops/{id}/offers(id=${shop.shopId})}">Ưu đãi</a>
    </nav>
</section>
<footer th:fragment="footer" class="sf-footer"><div class="sf-wrap">VietFresh Hub · Trái cây từ những cửa hàng bạn chọn.</div></footer>
</body>
</html>
