<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <th:block th:replace="~{fragments/interface-layout :: foundation}"></th:block>
    
<title th:text="${title} + ' | VietFresh Hub'"></title><link rel="stylesheet" th:href="@{/css/customer-shop.css}">
<meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}"><meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">

<script type="module" th:src="@{/js/storefront/storefront.js}"></script>    <th:block th:replace="~{fragments/interface-layout :: styles}"></th:block>
</head>
<body>
<header th:fragment="header" class="vfc-header">
  <div class="container">
    <div class="vfc-header-main">
      <button class="brand" data-home>VietFresh Hub</button>
      <div class="vfo-topbar-actions vfc-header-actions">
        <th:block th:fragment="accountLinks">
        <th:block th:replace="~{fragments/account-menu :: menu}"></th:block>
        </th:block>
      </div>
    </div>
    <div class="headmain vfc-header-tools">
      <div class="search"><input id="search" placeholder="Tìm trái cây trên toàn sàn..." aria-label="Tìm sản phẩm"><button id="searchGo">TÌM</button></div>
      <a id="cart" th:href="@{/cart}" style="border:1px solid #888;padding:7px 12px;text-decoration:none;white-space:nowrap">Giỏ hàng (<span id="cartCount" aria-live="polite">0</span>)</a>
    </div>
    <nav class="headcats" id="headcats"></nav>
  </div>
</header>
<div th:fragment="messages" aria-live="polite"><p th:if="${successMessage}" class="notice" th:text="${successMessage}"></p><p th:if="${errorMessage}" class="notice" th:text="${errorMessage}"></p></div>
<section th:fragment="shopHeader(shop,active)"><h1 th:text="${shop.shopName}"></h1></section>
<th:block th:fragment="footer">
  <th:block th:replace="~{fragments/footer :: footer}"></th:block>
  <div id="notice" class="notice hide"></div><div id="modal"></div>
</th:block>
</body></html>
