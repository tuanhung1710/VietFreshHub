<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="assets">
        <link rel="stylesheet" th:href="@{/css/header-account.css}">
        <link rel="stylesheet" th:href="@{/css/account-menu.css}">
        <script defer th:src="@{/js/header-account.js}"></script>
    </th:block>
</head>
<body>
<th:block th:fragment="menu">
    <span th:if="${#authorization.expression('!isAuthenticated()')}" class="header-account-guest">
        <a th:href="@{/login}" data-auth-link>Đăng nhập</a> /
        <a th:href="@{/register}" data-auth-link>Đăng ký</a>
    </span>
    <details th:if="${#authorization.expression('isAuthenticated()')}" class="header-account" data-header-account
             th:with="accountName=${headerAccountName != null ? headerAccountName : #authentication.name}">
        <summary class="header-account-trigger">
            <span class="header-account-avatar"><svg th:replace="~{fragments/account-menu :: icon('person')}"></svg></span>
            <span class="header-account-label"><span>Xin chào,</span><strong th:text="${accountName}"></strong></span>
            <svg class="header-account-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </summary>
        <div class="header-account-dropdown">
            <div class="header-account-heading"><span>Tài khoản của bạn</span><strong th:text="${accountName}"></strong></div>
            <nav class="header-account-links" aria-label="Chức năng tài khoản">
                <th:block th:if="${#authorization.expression('hasRole(''CUSTOMER'')')}">
                    <a th:href="@{/customer/profile}"><svg th:replace="~{fragments/account-menu :: icon('person')}"></svg><span>Tài khoản của tôi</span></a>
                    <a th:href="@{/customer/orders}"><svg th:replace="~{fragments/account-menu :: icon('orders')}"></svg><span>Đơn mua</span></a>
                    <a th:href="@{/customer/addresses}"><svg th:replace="~{fragments/account-menu :: icon('location')}"></svg><span>Sổ địa chỉ</span></a>
                    <a th:href="@{/customer/payments}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="17" height="13" rx="1"/><circle cx="12.5" cy="9.5" r="3"/><path d="M1 7v14h17"/></svg><span>Lịch sử thanh toán</span></a>
                    <a th:href="@{/customer/chat}"><svg th:replace="~{fragments/account-menu :: icon('chat')}"></svg><span>Tin nhắn với cửa hàng</span></a>
                    <a th:href="@{/cart}"><svg th:replace="~{fragments/account-menu :: icon('cart')}"></svg><span>Giỏ hàng</span></a>
                </th:block>
                <a th:if="${#authorization.expression('hasAnyRole(''ADMIN'',''STORE_MANAGER'',''DELIVERY_STAFF'')')}" th:href="@{/}">
                    <svg th:replace="~{fragments/account-menu :: icon('orders')}"></svg><span>Trang quản lý</span>
                </a>
                <a th:href="@{/notifications}"><svg th:replace="~{fragments/account-menu :: icon('bell')}"></svg><span>Thông báo</span></a>
            </nav>
            <form class="header-account-logout" th:action="@{/logout}" method="post">
                <button type="submit"><svg th:replace="~{fragments/account-menu :: icon('logout')}"></svg><span>Đăng xuất</span></button>
            </form>
        </div>
    </details>
</th:block>
<svg th:fragment="icon(name)" viewBox="0 0 24 24" aria-hidden="true" focusable="false" th:switch="${name}">
    <th:block th:case="'person'"><circle cx="12" cy="7.5" r="3.5"/><path d="M4 21v-3a8 4 0 0 1 16 0v3Z"/></th:block>
    <th:block th:case="'orders'"><path d="M6 3v16a2 2 0 0 1-4 0v-2h14v2a2 2 0 0 0 4 0V3l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M10 8h6m-6 4h6"/></th:block>
    <th:block th:case="'location'"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></th:block>
    <th:block th:case="'chat'"><path d="M3 3h18v14H8l-5 4Z"/></th:block>
    <th:block th:case="'cart'"><path d="M2 3h3l3 13h11l3-9H6"/><circle cx="9" cy="21" r="1"/><circle cx="19" cy="21" r="1"/></th:block>
    <th:block th:case="'bell'"><path d="M5 17h14l-2-3V9a5 5 0 0 0-10 0v5Zm5 3a2 2 0 0 0 4 0M12 2v2"/></th:block>
    <th:block th:case="'logout'"><path d="M9 3H4v18h5m5-14 5 5-5 5m-5-5h10"/></th:block>
</svg>
</body>
</html>
