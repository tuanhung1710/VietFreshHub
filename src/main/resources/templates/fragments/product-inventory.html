<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

    <!-- Tài nguyên trang -->
    <head th:fragment="head(title, feature)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <th:block th:replace="~{fragments/interface-layout :: foundation}"></th:block>
    
        
        
        <title th:text="${title + ' · VietFresh Hub'}">
            VietFresh Hub
        </title>
        <meta name="csrf-token" th:content="${_csrf.token}">
        <meta name="csrf-header" th:content="${_csrf.headerName}">
        <meta name="image-upload-url" th:content="@{/seller/products/images}">
        
        <link rel="stylesheet" th:href="@{/css/product/module.css}">
        <link rel="stylesheet" th:href="@{'/css/'+${feature}+'/'+${feature}+'.css'}">
        <link th:if="${feature == 'product'}" rel="stylesheet" th:href="@{/css/product/catalog.css}">
        
        <script defer th:src="@{/js/product/money-fields.js}"></script>
        <script th:if="${feature == 'product'}" defer th:src="@{/js/product/module.js}"></script>
        <th:block th:replace="~{fragments/interface-layout :: styles}"></th:block>
</head>

    <body>
        <div th:fragment="nav(active)">
<svg class="d-none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <symbol id="vf-leaf" viewBox="0 0 24 24">
                    <path d="M20 3c-9-1-17 4-15 11 2 6 13 5 15-11Z M4 21l9-10"/>
                </symbol>
                <symbol id="vf-shop" viewBox="0 0 24 24">
                    <path
                        d="M3 10l2-6h14l2 6 M3 10c0 4 4 4 4 0 0 4 5 4 5 0 0 4 5 4 5 0 0 4 4 4 4 0 M5 13v8h14v-8 M10 21v-6h4v6"
                    />
                </symbol>
                <symbol id="vf-product" viewBox="0 0 24 24">
                    <path
                        d="M12 8c-9-6-12 5-6 12 3 3 5 0 6 0s3 3 6 0c6-7 3-18-6-12Z M12 8c-1-5 3-6 5-5 0 3-2 4-5 5 M12 8l-2-5"
                    />
                </symbol>
                <symbol id="vf-box" viewBox="0 0 24 24">
                    <path d="M3 7l9-5 9 5v10l-9 5-9-5Z M3 7l9 5 9-5 M12 12v10 M7 4l10 5"/>
                </symbol>
                <symbol id="vf-order" viewBox="0 0 24 24">
                    <path d="M6 3h12v18l-3-2-3 2-3-2-3 2Z M9 7h6 M9 11h6 M9 15h3"/>
                </symbol>
                <symbol id="vf-search" viewBox="0 0 24 24">
                    <circle cx="10" cy="10" r="6"/>
                    <path d="m15 15 6 6"/>
                </symbol>
                <symbol id="vf-plus" viewBox="0 0 24 24">
                    <path d="M12 5v14 M5 12h14"/>
                </symbol>
                <symbol id="vf-edit" viewBox="0 0 24 24">
                    <path d="m15 4 5 5 M4 20l4-1L21 6l-4-4L4 15Z M13 20h8"/>
                </symbol>
                <symbol id="vf-eye" viewBox="0 0 24 24">
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                    <circle cx="12" cy="12" r="3"/>
                </symbol>
                <symbol id="vf-eye-off" viewBox="0 0 24 24">
                    <path d="M3 3l18 18M10 5.2a11 11 0 0 1 2-.2c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.1 6.1A19 19 0 0 0 2 12s3.5 7 10 7a10.7 10.7 0 0 0 5.2-1.4M10 10a2.8 2.8 0 0 0 4 4"/>
                </symbol>
                <symbol id="vf-more" viewBox="0 0 24 24">
                    <circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>
                </symbol>
                <symbol id="vf-adjust" viewBox="0 0 24 24">
                    <path d="M3 6h5m4 0h9M3 12h11m4 0h3M3 18h2m4 0h12M8 3v6M14 9v6M5 15v6"/>
                </symbol>
                <symbol id="vf-filter" viewBox="0 0 24 24">
                    <path d="M3 5h7m4 0h7M3 12h2m4 0h12M3 19h7m4 0h7M12 2v6M7 9v6M12 16v6"/>
                </symbol>
                <symbol id="vf-reset" viewBox="0 0 24 24">
                    <path d="M3 11a9 9 0 1 1 2.64 6.36M3 4v7h7"/>
                </symbol>
                <symbol id="vf-lock" viewBox="0 0 24 24">
                    <rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/>
                </symbol>
                <symbol id="vf-unlock" viewBox="0 0 24 24">
                    <rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0M12 14v3"/>
                </symbol>
                <symbol id="vf-trash" viewBox="0 0 24 24">
                    <path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/>
                </symbol>
                <symbol id="vf-tag" viewBox="0 0 24 24">
                    <path d="m3 3 8 0 10 10-8 8L3 11Z"/><circle cx="7" cy="7" r="1"/>
                </symbol>
                <symbol id="vf-history" viewBox="0 0 24 24">
                    <path d="M3 11a9 9 0 1 1 2 7 M3 4v7h7 M12 7v5l3 2"/>
                </symbol>
                <symbol id="vf-archive" viewBox="0 0 24 24">
                    <path d="M4 8h16v13H4Z M3 3h18v5H3Z M9 12h6"/>
                </symbol>
                <symbol id="vf-chevron" viewBox="0 0 24 24">
                    <path d="m9 5 7 7-7 7"/>
                </symbol>
                <symbol id="vf-user" viewBox="0 0 24 24">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 22v-3a8 8 0 0 1 16 0v3"/>
                </symbol>
                <symbol id="vf-menu" viewBox="0 0 24 24">
                    <path d="M4 6h16 M4 12h16 M4 18h16"/>
                </symbol>
            </svg>
<th:block th:replace="~{fragments/interface-navigation :: seller(${active})}"></th:block>
</div>
        <!-- Trình bày thời gian trong nhật ký hoạt động. -->
        <time th:fragment="historyTime(timestamp)" class="vf-history-time-content"
              th:datetime="${timestamp.plusHours(7)} + '+07:00'">
            <span th:text="${#temporals.format(timestamp.plusHours(7),'dd/MM/yyyy')}"></span>
            <small class="text-body-secondary" th:text="${#temporals.format(timestamp.plusHours(7),'HH:mm:ss')}"></small>
        </time>

        <!-- Cụm chuyển trang gọn; hai nút giữ vị trí khi bị vô hiệu hóa. -->
        <div
            th:fragment="pagination(pageData, previousUrl, nextUrl, label, unit)"
            class="vf-pagination"
            role="navigation"
            th:attr="aria-label=${label}"
        >
            <a
                class="btn btn-sm btn-outline-secondary vf-page-previous"
                aria-label="Trang trước"
                title="Trang trước"
                th:classappend="${!pageData.hasPrevious() ? 'disabled' : ''}"
                th:attr="href=${pageData.hasPrevious() ? previousUrl : null},aria-disabled=${!pageData.hasPrevious()},tabindex=${pageData.hasPrevious() ? null : -1}"
            >
                <svg class="vf-icon" aria-hidden="true">
                    <use href="#vf-chevron"/>
                </svg>
            </a>
            <span class="vf-page-summary text-secondary" aria-live="polite">
                <span
                    th:text="${'Trang ' + (pageData.number + 1) + ' / ' + T(java.lang.Math).max(1, pageData.totalPages)}"
                >
                </span>
                <small th:if="${!#strings.isEmpty(unit)}" th:text="${pageData.totalElements + ' ' + unit}">
                </small>
            </span>
            <a
                class="btn btn-sm btn-outline-secondary vf-page-next"
                aria-label="Trang sau"
                title="Trang sau"
                th:classappend="${!pageData.hasNext() ? 'disabled' : ''}"
                th:attr="href=${pageData.hasNext() ? nextUrl : null},aria-disabled=${!pageData.hasNext()},tabindex=${pageData.hasNext() ? null : -1}"
            >
                <svg class="vf-icon" aria-hidden="true">
                    <use href="#vf-chevron"/>
                </svg>
            </a>
        </div>

        <th:block th:fragment="pageSize(pageData, selectId, label)">
            <label th:for="${selectId}" th:text="${label}"></label>
            <select class="form-select form-select-sm" name="size" th:id="${selectId}">
                <option th:each="pageSize : ${T(VietFreshHub.common.PageSizes).OPTIONS}"
                        th:value="${pageSize}"
                        th:selected="${pageData.size == pageSize}"
                        th:text="${pageSize}">
                </option>
            </select>
            <button class="btn btn-sm btn-light" type="submit">Áp dụng</button>
        </th:block>

        <div th:fragment="messages" aria-live="polite">
            <div class="alert alert-success" th:if="${success}" th:text="${success}">
            </div>
            <div class="alert alert-danger" th:if="${error}" th:text="${error}" role="alert" tabindex="-1" data-vf-error>
            </div>
        </div>
        <div th:fragment="errors" class="alert alert-danger" th:if="${#fields.hasAnyErrors()}" role="alert">
            <p class="mb-1" th:each="err : ${#fields.allErrors()}" th:text="${err}">
            </p>
        </div>
        <div th:fragment="variantActionModal(returnToList)" class="modal fade" id="variantActionModal" tabindex="-1"
             aria-labelledby="variantActionTitle" aria-describedby="variantActionDescription" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <form id="variantActionForm" th:action="@{/seller/products}" method="post" data-vf-catalog-action>
                        <input type="hidden" name="returnToList" th:value="${returnToList}">
                        <input type="hidden" name="status" id="variantActionStatus">
                        <th:block th:if="${returnToList}">
                            <th:block th:replace="~{fragments/product-catalog :: filters}"></th:block>
                            <input type="hidden" name="page" th:value="${rows.number + 1}">
                            <input type="hidden" name="size" th:value="${rows.size}">
                        </th:block>
                        <div class="modal-header">
                            <h2 class="modal-title fs-5" id="variantActionTitle">Trạng thái SKU</h2>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                        </div>
                        <div class="modal-body">
                            <p class="fw-semibold text-break" id="variantActionName"></p>
                            <p class="small text-secondary" id="variantActionDescription"></p>
                            <label class="form-label" for="variantActionReason">Lý do thay đổi *</label>
                            <textarea class="form-control" id="variantActionReason" name="reason" rows="3"
                                      maxlength="900" required></textarea>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>
                            <button type="submit" class="btn btn-success" id="variantActionSubmit">Xác nhận</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div th:fragment="variantDeleteModal(returnToList)" class="modal fade" id="variantDeleteModal" tabindex="-1"
             aria-labelledby="variantDeleteTitle" aria-describedby="variantDeleteDescription" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <form id="variantDeleteForm" th:action="@{/seller/products}" method="post" data-vf-catalog-action>
                        <input type="hidden" name="returnToList" th:value="${returnToList}">
                        <th:block th:if="${returnToList}">
                            <th:block th:replace="~{fragments/product-catalog :: filters}"></th:block>
                            <input type="hidden" name="page" th:value="${rows.number + 1}">
                            <input type="hidden" name="size" th:value="${rows.size}">
                        </th:block>
                        <div class="modal-header">
                            <h2 class="modal-title fs-5" id="variantDeleteTitle">Xóa phân loại</h2>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                        </div>
                        <div class="modal-body">
                            <p class="fw-semibold text-break" id="variantDeleteName"></p>
                            <p class="small text-secondary" id="variantDeleteDescription">
                                Phân loại sẽ được xóa khỏi danh sách. Tồn kho và lịch sử vẫn được giữ lại trong Kho hàng.
                                Nếu không còn phân loại mở bán, sản phẩm sẽ tự tạm ẩn.
                            </p>
                            <label class="form-label" for="variantDeleteReason">Lý do xóa *</label>
                            <textarea class="form-control" id="variantDeleteReason" name="reason" rows="3"
                                      maxlength="900" required></textarea>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>
                            <button type="submit" class="btn btn-danger">Xóa phân loại</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Hiển thị trạng thái bán hàng và vi phạm trên màn hình Sản phẩm. -->
        <th:block th:fragment="productStatus(row)">
            <span class="badge"
                  th:classappend="${row.managementState.code=='active'?'vf-badge-green':(row.managementState.code=='violation'?'vf-badge-red':'vf-badge-gray')}"
                  th:text="${row.managementState.label}"
                  th:title="${row.managementState.code=='archived'?'Sản phẩm đã xóa; tồn kho và lịch sử được lưu trong Kho hàng.':row.managementState.reason}"></span>
        </th:block>
    </body>
</html>
