<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="filters">
    <input type="hidden" name="q" th:value="${filters.q}">
    <input type="hidden" name="category" th:value="${filters.category}">
    <input type="hidden" name="tab" th:value="${filters.tab}">
    <input type="hidden" name="sort" th:value="${filters.sort}">
</th:block>
<span th:fragment="money(value)" th:text="${@vndAmounts.format(value) + 'đ'}"></span>
</body>
</html>
