<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="sidebar(active)" class="nav flex-column vfo-side-nav vfo-grouped-nav" aria-label="Điều hướng khách hàng">
    <a class="nav-link" th:href="@{/home}" th:classappend="${active == 'home' ? 'active' : ''}" th:attr="aria-current=${active == 'home' ? 'page' : null}"><svg class="vfo-icon" aria-hidden="true"><use href="#vfo-grid"/></svg>Trang chủ</a>
    <details class="vfo-nav-group" open>
        <summary>Khám phá &amp; mua sắm</summary>
        <div class="vfo-group-links">
            <a class="nav-link" th:href="@{/products}" th:classappend="${active == 'products' ? 'active' : ''}" th:attr="aria-current=${active == 'products' ? 'page' : null}"><svg class="vfo-icon" aria-hidden="true"><use href="#vfo-product"/></svg>Tất cả sản phẩm</a>
            <a class="nav-link" th:href="@{/shops}" th:classappend="${active == 'shops' ? 'active' : ''}" th:attr="aria-current=${active == 'shops' ? 'page' : null}"><svg class="vfo-icon" aria-hidden="true"><use href="#vfo-shop"/></svg>Hệ thống cửa hàng</a>
            <a class="nav-link" th:href="@{/cart}" th:classappend="${active == 'cart' ? 'active' : ''}" th:attr="aria-current=${active == 'cart' ? 'page' : null}"><svg class="vfo-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 3h3l3 13h11l3-9H6"/><circle cx="9" cy="21" r="1"/><circle cx="19" cy="21" r="1"/></svg>Giỏ hàng</a>
        </div>
    </details>
    <details class="vfo-nav-group" open>
        <summary>Đơn hàng &amp; trao đổi</summary>
        <div class="vfo-group-links">
            <a class="nav-link" th:href="@{/customer/orders}" th:classappend="${active == 'orders' ? 'active' : ''}" th:attr="aria-current=${active == 'orders' ? 'page' : null}"><svg class="vfo-icon" aria-hidden="true"><use href="#vfo-order"/></svg>Đơn hàng của tôi</a>
            <a class="nav-link" th:href="@{/reviews/mine}" th:classappend="${active == 'reviews' ? 'active' : ''}" th:attr="aria-current=${active == 'reviews' ? 'page' : null}"><svg class="vfo-icon" aria-hidden="true"><use href="#vfo-check"/></svg>Đánh giá của tôi</a>
            <a class="nav-link" th:href="@{/customer/chat}" th:classappend="${active == 'chat' ? 'active' : ''}" th:attr="aria-current=${active == 'chat' ? 'page' : null}"><svg class="vfo-icon" aria-hidden="true"><use href="#vfo-chat"/></svg>Tin nhắn với cửa hàng</a>
        </div>
    </details>
</nav>

<!-- All buyer pages share one collapsible sidebar. -->
<th:block th:fragment="workspace(active)">
    <a class="vfo-skip-link" href="#workspace-content">Đến nội dung chính</a>
    <svg th:replace="~{fragments/seller-orders :: icons}"></svg>
    <header class="vfc-header vfc-customer-header" data-workspace-header>
        <div class="vfo-topbar navbar">
            <div class="vfo-brand-group"><a th:replace="~{fragments/interface-layout :: customerBrand}"></a></div>
            <div class="vfo-topbar-actions"><th:block th:replace="~{fragments/account-menu :: menu}"></th:block></div>
        </div>
        <th:block th:if="${active == 'home'}">
            <div class="vfc-home-tools">
                <form class="vfc-home-search" th:action="@{/products}" method="get" role="search">
                    <input id="search" class="form-control" type="search" name="q" maxlength="100" th:value="${q}" placeholder="Tìm trái cây trên toàn sàn..." aria-label="Tìm sản phẩm">
                    <button id="searchGo" class="btn vfo-btn-primary" type="submit">Tìm kiếm</button>
                </form>
                <a id="cart" class="vfc-home-cart" th:href="@{/cart}" aria-label="Giỏ hàng" title="Giỏ hàng">
                    <svg class="vfo-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 3h3l3 13h11l3-9H6"/><circle cx="9" cy="21" r="1"/><circle cx="19" cy="21" r="1"/></svg>
                    <span id="cartCount" aria-live="polite" th:text="${storefrontCartCount != null ? storefrontCartCount : (cartBadgeTotal != null ? cartBadgeTotal : 0)}">0</span>
                </a>
            </div>
            <nav id="headcats" class="vfc-home-categories" aria-label="Danh mục sản phẩm" th:if="${headerCategories != null and !#lists.isEmpty(headerCategories)}">
                <a th:href="@{/products}">Tất cả sản phẩm</a>
                <a th:each="category : ${headerCategories}" th:href="@{/products(category=${category.categoryId})}" th:text="${category.name}"></a>
            </nav>
        </th:block>
    </header>
    <th:block th:replace="~{fragments/customer-navigation :: sidebarShell(${active})}"></th:block>
</th:block>
<th:block th:fragment="sidebarShell(active)">
    <button class="btn vfo-menu-toggle vfo-sidebar-toggle" type="button" data-workspace-sidebar-toggle data-bs-toggle="offcanvas" data-bs-target="#vfoSidebar" aria-controls="vfoSidebar" aria-expanded="true" aria-label="Ẩn thanh điều hướng"><svg class="vfo-icon" aria-hidden="true"><use href="#vfo-menu"/></svg></button>
    <aside class="offcanvas-lg offcanvas-start vfo-sidebar" tabindex="-1" id="vfoSidebar" aria-labelledby="customerSidebarTitle">
        <div class="offcanvas-header d-lg-none"><h2 class="offcanvas-title" id="customerSidebarTitle">Mua sắm</h2><button class="btn-close" type="button" data-bs-dismiss="offcanvas" data-bs-target="#vfoSidebar" aria-label="Đóng menu"></button></div>
        <div class="offcanvas-body"><nav th:replace="~{fragments/customer-navigation :: sidebar(${active})}"></nav></div>
    </aside>
</th:block>
</body>
</html>
