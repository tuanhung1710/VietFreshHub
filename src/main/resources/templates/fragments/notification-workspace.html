<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thông báo | VietFresh Hub</title>
    <th:block th:replace="~{fragments/seller-orders :: assets}"></th:block>
    <link rel="stylesheet" th:href="@{/css/workspace-management.css}">
    <link rel="stylesheet" th:href="@{/css/customer-navigation.css}">
    <link th:if="${#authorization.expression('hasRole(''DELIVERY_STAFF'')')}" rel="stylesheet" th:href="@{/css/delivery-staff.css}">
</head>
<body>
<th:block th:fragment="navigation"
          th:with="admin=${activeChannel == 'admin'},seller=${activeChannel == 'seller'},staff=${activeChannel == 'delivery'}">
    <th:block th:if="${admin}"><th:block th:replace="~{fragments/admin-workspace :: navigation('notifications')}"></th:block></th:block>
    <th:block th:if="${!admin and seller}"><th:block th:replace="~{fragments/seller-orders :: navigation('notifications')}"></th:block></th:block>
    <th:block th:if="${!admin and !seller and staff}"><th:block th:replace="~{fragments/delivery-layout :: navigation('notifications')}"></th:block></th:block>
    <th:block th:if="${!admin and !seller and !staff}">
        <script defer th:src="@{/js/notifications.js}"></script>
        <th:block th:replace="~{fragments/customer-navigation :: workspace('notifications')}"></th:block>
    </th:block>
</th:block>
<footer th:fragment="footer" th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
