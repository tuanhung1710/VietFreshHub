<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">VietFresh Hub</title>
    <th:block th:replace="~{fragments/interface-layout :: foundation}"></th:block>
    <th:block th:replace="~{fragments/interface-layout :: styles}"></th:block>
</head>
<head th:fragment="customerHead(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title + ' | VietFresh Hub'}">VietFresh Hub</title>
    <th:block th:replace="~{fragments/interface-layout :: foundation}"></th:block>
    <link rel="stylesheet" th:href="@{/css/storefront.css}">
    <link rel="stylesheet" th:href="@{/css/customer-orders.css}">
    <link rel="stylesheet" th:href="@{/css/customer-shell.css}">
    <link rel="stylesheet" th:href="@{/css/customer-pagination.css}">
    <link rel="stylesheet" th:href="@{/css/customer-purchases.css}">
    <script defer th:src="@{/js/cart.js}"></script>
    <th:block th:replace="~{fragments/interface-layout :: styles}"></th:block>
</head>
<body>
<a th:fragment="customerBrand" class="vfo-brand" th:href="@{/home}" aria-label="VietFresh Hub — Trang chủ"><span class="vfo-brand-mark"><svg class="vfo-icon" aria-hidden="true"><use href="#vfo-leaf"/></svg></span><span><span class="vfo-brand-name"><strong>VietFresh</strong> Hub</span><span class="vfo-brand-tagline">Fresh from the heart</span></span></a>
<th:block th:fragment="foundation">
    <th:block th:replace="~{fragments/seller-orders :: assets}"></th:block>
    <link rel="stylesheet" th:href="@{/css/order-service-pages.css}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
</th:block>
<th:block th:fragment="styles">
    <link rel="stylesheet" th:href="@{/css/interface-utilities.css}">
    <link rel="stylesheet" th:href="@{/css/interface-theme.css}">
    <link rel="stylesheet" th:href="@{/css/customer-navigation.css}">
</th:block>
<th:block th:fragment="customerHeader(active)">
    <th:block th:replace="~{fragments/customer-navigation :: workspace(${active})}"></th:block>
</th:block>
<th:block th:fragment="navigation(role, active)">
    <th:block th:if="${role == 'admin'}"><th:block th:replace="~{fragments/interface-navigation :: admin(${active})}"></th:block></th:block>
    <th:block th:if="${role == 'seller'}"><th:block th:replace="~{fragments/interface-navigation :: seller(${active})}"></th:block></th:block>
    <th:block th:if="${role == 'customer' or role == 'public'}"><th:block th:replace="~{fragments/interface-layout :: customerHeader(${active})}"></th:block></th:block>
</th:block>
<th:block th:fragment="footer(role)">
    <th:block th:replace="~{fragments/footer :: footer}"></th:block>
</th:block>
</body>
</html>
