<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="vf-batch-detail-actions" th:fragment="batchActions(row)" th:with="id=${row.batch.batchId}">
    <div class="d-flex flex-wrap gap-2">
        <a class="btn btn-outline-success" th:if="${row.canAdjust}"
           th:href="@{/seller/inventory/batches/{id}/adjust(id=${id},returnTo=${inventoryCurrentUrl})}">Điều chỉnh tồn</a>
        <a class="btn btn-outline-danger" th:if="${row.canDispose}"
           th:href="@{/seller/inventory/batches/{id}/dispose(id=${id},returnTo=${inventoryCurrentUrl})}">Hủy hàng hết hạn</a>
        <a class="btn btn-outline-secondary" th:if="${row.canMarkdown && row.markdown == null}"
           th:href="@{/seller/inventory/batches/{id}/markdown(id=${id},returnTo=${inventoryCurrentUrl})}">Giảm giá lô cận hạn</a>
        <a class="btn btn-light"
           th:href="@{/seller/inventory/audit(q=${row.batch.batchCode},entity='BATCH',returnTo=${inventoryCurrentUrl})}">Lịch sử lô</a>
    </div>
    <details class="mt-3" th:if="${row.canBlock || row.canUnblock}">
        <summary class="text-success fw-semibold" th:text="${row.canBlock?'Khóa lô':'Mở khóa lô'}"></summary>
        <form class="mt-2" method="post" th:action="@{/seller/inventory/batches/{id}/block(id=${id})}">
            <input type="hidden" name="returnTo" th:value="${inventoryCurrentUrl}">
            <input type="hidden" name="blocked" th:value="${row.canBlock}">
            <label for="batchBlockReason" class="form-label">Lý do thay đổi</label>
            <textarea id="batchBlockReason" name="reason" class="form-control" rows="2" maxlength="900" required></textarea>
            <button type="submit" class="btn btn-sm btn-success mt-2">Xác nhận</button>
        </form>
    </details>
    <details class="mt-3" th:if="${row.markdown != null}">
        <summary class="text-success fw-semibold">Dừng giảm giá lô</summary>
        <form class="mt-2" method="post" th:action="@{/seller/inventory/batches/{id}/cancel-markdown(id=${id})}">
            <input type="hidden" name="returnTo" th:value="${inventoryCurrentUrl}">
            <label for="batchMarkdownReason" class="form-label">Lý do dừng giảm giá</label>
            <textarea id="batchMarkdownReason" name="reason" class="form-control" rows="2" maxlength="900" required></textarea>
            <button type="submit" class="btn btn-sm btn-success mt-2">Xác nhận</button>
        </form>
    </details>
</div>
</body>
</html>
