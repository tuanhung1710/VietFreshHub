<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn giao hàng của tôi | VIETFRESH HUB</title>
    <style>
        body {
            max-width: 1000px;
            margin: 24px auto;
            padding: 0 16px;
            font-family: Arial, sans-serif;
            line-height: 1.5;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
        }
    </style>
</head>
<body>
<header>
    <span th:replace="~{fragments/notifications :: bell}"></span>
    <p>VIETFRESH HUB</p>
</header>
<main id="delivery-dashboard">
    <h1>ĐƠN GIAO HÀNG CỦA TÔI</h1>
    <p><a th:href="@{/delivery/available}">Nhận đơn mới</a></p>
    <p><a th:href="@{/delivery/history}">Lịch sử giao hàng</a></p>
    <p><a th:href="@{/delivery/cod-summary}">COD giao thành công hôm nay</a></p>
    <p th:text="|Sức chứa đang giữ: ${activeAssignmentCount} / ${maxActiveAssignments} đơn.|"></p>
    <p id="delivery-refresh-status" role="status" hidden></p>
    <p th:if="${#lists.isEmpty(assignedDeliveries)}">Hiện không có đơn giao hàng nào được phân công cho bạn.</p>
    <div class="table-container" th:unless="${#lists.isEmpty(assignedDeliveries)}">
        <table>
            <thead>
            <tr>
                <th scope="col">Mã đơn hàng</th>
                <th scope="col">Trạng thái phân công</th>
                <th scope="col">Trạng thái giao hàng</th>
                <th scope="col">Thời gian phân công</th>
                <th scope="col">Thời gian chấp nhận</th>
                <th scope="col">Chi tiết</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="delivery : ${assignedDeliveries}">
                <td th:text="${delivery.orderCode}"></td>
                <td><strong th:text="${delivery.assignmentStatusLabel}"></strong></td>
                <td><strong th:text="${delivery.deliveryStatusLabel}"></strong></td>
                <td th:text="${delivery.assignedAt == null ? 'Chưa ghi nhận' : #temporals.format(delivery.assignedAt, 'dd-MM-yyyy HH:mm:ss')}"></td>
                <td th:text="${delivery.acceptedAt == null ? 'Chưa chấp nhận' : #temporals.format(delivery.acceptedAt, 'dd-MM-yyyy HH:mm:ss')}"></td>
                <td>
                    <a th:href="@{/delivery/assignments/{assignmentId}(assignmentId=${delivery.assignmentId})}">Xem chi tiết</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<script>
    async function refreshAssignments() {
        if (!document.hidden) {
            try {
                const response = await fetch(window.location.pathname, {cache: 'no-store'});
                if (!response.ok || response.redirected) {
                    throw new Error('Không thể cập nhật danh sách.');
                }
                const page = new DOMParser().parseFromString(await response.text(), 'text/html');
                const dashboard = page.getElementById('delivery-dashboard');
                if (dashboard) {
                    document.getElementById('delivery-dashboard').replaceWith(dashboard);
                    if (window.vietFreshNotifications) {
                        window.vietFreshNotifications.updateFrom(page);
                    }
                }
            } catch (error) {
                document.getElementById('delivery-refresh-status').textContent =
                    'Chưa tải được danh sách mới. Hệ thống sẽ thử lại sau 5 giây.';
                document.getElementById('delivery-refresh-status').hidden = false;
            }
        }
        window.setTimeout(refreshAssignments, 5000);
    }
    window.setTimeout(refreshAssignments, 5000);
</script>
</body>
</html>
