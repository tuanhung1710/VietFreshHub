<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn giao được phân công | VIETFRESH HUB</title>
    <style>
        body {
            max-width: 1000px;
            margin: 24px auto;
            padding: 0 16px;
            font-family: Arial, sans-serif;
            line-height: 1.5;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
        }
    </style>
</head>
<body>
<header>
    <p>VIETFRESH HUB</p>
</header>
<main>
    <h1>ĐƠN GIAO ĐƯỢC PHÂN CÔNG</h1>
    <p>Xem chi tiết đơn giao hàng để chấp nhận phân công và xác nhận nhận hàng.</p>
    <p th:if="${#lists.isEmpty(assignedDeliveries)}">Hiện không có đơn giao hàng nào được phân công cho bạn.</p>
    <div class="table-container" th:unless="${#lists.isEmpty(assignedDeliveries)}">
        <table>
            <thead>
            <tr>
                <th scope="col">Mã đơn hàng</th>
                <th scope="col">Trạng thái phân công</th>
                <th scope="col">Trạng thái giao hàng</th>
                <th scope="col">Thời gian phân công</th>
                <th scope="col">Thời gian chấp nhận</th>
                <th scope="col">Chi tiết</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="delivery : ${assignedDeliveries}">
                <td th:text="${delivery.orderCode}"></td>
                <td><strong th:text="${delivery.assignmentStatus}"></strong></td>
                <td><strong th:text="${delivery.deliveryStatus}"></strong></td>
                <td th:text="${delivery.assignedAt == null ? '—' : #temporals.format(delivery.assignedAt, 'dd-MM-yyyy HH:mm')}"></td>
                <td th:text="${delivery.acceptedAt == null ? '—' : #temporals.format(delivery.acceptedAt, 'dd-MM-yyyy HH:mm')}"></td>
                <td>
                    <a th:href="@{/delivery/assignments/{assignmentId}(assignmentId=${delivery.assignmentId})}">Xem chi tiết</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
