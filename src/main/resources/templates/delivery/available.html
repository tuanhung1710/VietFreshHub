<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/delivery-layout :: head('Nhận đơn mới')}"></head>
<body class="vfo-app vfd-app">
<th:block th:replace="~{fragments/delivery-layout :: navigation('available')}"></th:block>
<div id="delivery-content" class="vfo-workspace" tabindex="-1">
    <main class="vfo-main">
        <header class="vfo-page-heading">
            <div><h1>Nhận đơn mới</h1></div>
        </header>
        <p class="vfd-alert vfd-alert-danger" th:if="${errorMessage != null}" th:text="${errorMessage}" role="alert"></p>
        <p id="available-refresh-status" class="vfd-alert vfd-alert-warning" role="status" hidden></p>
        <section id="available-deliveries" class="card vfo-list-card" th:fragment="deliveries"
                 th:attr="data-refresh-url=@{/delivery/available(fragment=true,page=${availablePage.number + 1},size=${availablePage.size})},data-page-size=${availablePage.size}">
            <div class="vfo-list-heading">
                <div><span class="vfo-section-marker" aria-hidden="true"></span><h2>Đơn giao hàng có thể nhận</h2><span class="vfo-count" th:text="${availablePage.totalElements}"></span></div>
            </div>
            <div class="vfo-empty-state" th:if="${#lists.isEmpty(availableDeliveries)}">
                <span class="vfo-empty-icon"><svg class="vfo-icon" aria-hidden="true"><use href="#vfo-box"/></svg></span>
                <h3>Chưa có đơn mới</h3><p>Hiện chưa có đơn giao hàng nào có thể nhận.</p>
            </div>
            <div class="table-responsive" th:unless="${#lists.isEmpty(availableDeliveries)}">
                <table class="table table-hover align-middle mb-0 vfd-available-table">
                    <caption class="visually-hidden">Đơn giao hàng có thể nhận</caption>
                    <thead>
                    <tr>
                        <th scope="col">Mã đơn hàng</th>
                        <th scope="col">Cửa hàng lấy hàng</th>
                        <th scope="col">Địa chỉ lấy hàng</th>
                        <th scope="col">Địa chỉ giao hàng</th>
                        <th scope="col">Nhận đơn</th>
                        <th scope="col" class="text-end">Chi tiết</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="delivery : ${availableDeliveries}">
                        <td class="vfo-order-code" th:text="${delivery.orderCode}"></td>
                        <td class="vfo-customer-name" th:text="${delivery.shopName ?: 'Chưa có thông tin'}"></td>
                        <td class="vfd-address-cell" th:insert="~{delivery/available :: address(location=${delivery.pickupLocation})}"></td>
                        <td class="vfd-address-cell" th:insert="~{delivery/available :: address(location=${delivery.deliveryLocation})}"></td>
                        <td>
                            <form method="post" th:action="@{/delivery/available/{deliveryId}/claim(deliveryId=${delivery.deliveryId})}">
                                <button class="btn vfo-btn-primary vfd-claim-button" type="submit">Nhận đơn</button>
                            </form>
                        </td>
                        <td class="text-end"><a class="btn vfo-detail-link" th:href="@{/delivery/available/{deliveryId}(deliveryId=${delivery.deliveryId})}">Xem chi tiết<svg class="vfo-icon vfo-icon-sm" aria-hidden="true"><use href="#vfo-arrow"/></svg></a></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:replace="~{fragments/pagination :: panel(${availablePage},
                @{/delivery/available(page=${availablePage.number},size=${availablePage.size})},
                @{/delivery/available(page=${availablePage.number + 2},size=${availablePage.size})},
                @{/delivery/available}, ${ {:} }, 'Phân trang đơn có thể nhận', 'đơn hàng', 'Đơn hàng mỗi trang')}"></div>
        </section>
    </main>
    <footer th:replace="~{fragments/delivery-layout :: footer}"></footer>
</div>
<template>
<th:block th:fragment="address(location)">
    <span th:if="${location == null}">Chưa có thông tin địa chỉ</span>
    <span th:if="${location != null}">
        <span th:if="${!#strings.isEmpty(#strings.trim(location.formattedAddress))}"
              th:text="${location.formattedAddress}"></span>
        <span th:if="${#strings.isEmpty(#strings.trim(location.formattedAddress))}">
            <span th:text="${location.addressLine ?: '—'}"></span>
            <span th:if="${!#strings.isEmpty(location.ward)}" th:text="|, ${location.ward}|"></span>
            <span th:if="${!#strings.isEmpty(location.district)}" th:text="|, ${location.district}|"></span>
            <span th:if="${!#strings.isEmpty(location.province)}" th:text="|, ${location.province}|"></span>
        </span>
    </span>
</th:block>
</template>
<script>
    async function refreshAvailableDeliveries() {
        if (!document.hidden) {
            try {
                const currentList = document.getElementById('available-deliveries');
                const sizeSelect = currentList.querySelector('select[name="size"]');
                if (currentList.querySelector('.vf-page-size').contains(document.activeElement)
                        || sizeSelect.value !== currentList.dataset.pageSize) {
                    window.setTimeout(refreshAvailableDeliveries, 1000);
                    return;
                }
                const response = await fetch(currentList.dataset.refreshUrl, {cache: 'no-store'});
                if (!response.ok || response.redirected) {
                    throw new Error('Không thể cập nhật danh sách.');
                }
                const page = new DOMParser().parseFromString(await response.text(), 'text/html');
                const updatedList = page.getElementById('available-deliveries');
                if (!updatedList) {
                    throw new Error('Không tìm thấy danh sách.');
                }
                currentList.replaceWith(updatedList);
                document.getElementById('available-refresh-status').textContent = '';
                document.getElementById('available-refresh-status').hidden = true;
            } catch (error) {
                document.getElementById('available-refresh-status').textContent =
                    'Chưa tải được danh sách mới. Hệ thống sẽ thử lại sau 1 giây.';
                document.getElementById('available-refresh-status').hidden = false;
            }
        }
        window.setTimeout(refreshAvailableDeliveries, 1000);
    }
    window.setTimeout(refreshAvailableDeliveries, 1000);
</script>
</body>
</html>
