<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/delivery-layout :: head('Tổng hợp COD trong ngày')}"></head>
<body class="vfo-app vfd-app">
<th:block th:replace="~{fragments/delivery-layout :: navigation('cod')}"></th:block>
<div id="delivery-content" class="vfo-workspace" tabindex="-1">
    <main class="vfo-main vfd-cod-page">
        <header class="vfo-page-heading">
            <div>
                <h1>Tổng hợp COD trong ngày</h1>
            </div>
        </header>
        <section class="card vfd-cod-filter" aria-labelledby="cod-date-heading">
            <div class="vfd-cod-date-heading">
                <span class="vfo-heading-icon"><svg class="vfo-icon" aria-hidden="true"><use href="#vfo-history"/></svg></span>
                <div><h2 id="cod-date-heading">Ngày ghi nhận</h2><p th:text="${#temporals.format(codSummary.date, 'dd-MM-yyyy')}"></p></div>
            </div>
            <form method="get" th:action="@{/delivery/cod-summary}">
                <label for="cod-date">Ngày</label>
                <input class="form-control" id="cod-date" type="date" name="date" th:value="${codSummary.date}"
                       min="0001-01-01" max="9999-12-31" required>
                <button class="btn vfo-btn-primary" type="submit">Xem</button>
            </form>
        </section>
        <div class="vfd-cod-grid">
            <section class="vfd-cod-total" aria-labelledby="cod-amount-heading">
                <div class="vfd-cod-card-top">
                    <span class="vfd-cod-icon"><svg class="vfo-icon" aria-hidden="true"><use href="#vfo-bank"/></svg></span>
                    <span class="vfd-cod-note">Chưa đối soát</span>
                </div>
                <dl>
                    <dt id="cod-amount-heading">Tổng tiền COD ghi nhận (chưa đối soát)</dt>
                    <dd><strong th:text="${#numbers.formatDecimal(codSummary.amount, 1, 'POINT', codSummary.amount.stripTrailingZeros().scale() > 0 ? 2 : 0, 'COMMA')} + ' VNĐ'"></strong></dd>
                </dl>
                <svg class="vfo-icon vfd-cod-leaf" aria-hidden="true"><use href="#vfo-leaf"/></svg>
            </section>
            <section class="card vfd-cod-count" aria-labelledby="cod-count-heading">
                <span class="vfd-cod-icon"><svg class="vfo-icon" aria-hidden="true"><use href="#vfo-check"/></svg></span>
                <dl>
                    <dt id="cod-count-heading">Số đơn COD giao thành công</dt>
                    <dd><strong th:text="|${codSummary.deliveryCount} đơn|"></strong></dd>
                </dl>
            </section>
        </div>
        <div class="card vfd-cod-empty" th:if="${codSummary.amount.signum() == 0}">
            <span class="vfo-empty-icon"><svg class="vfo-icon" aria-hidden="true"><use href="#vfo-bank"/></svg></span>
            <p th:text="${isToday ? 'Hôm nay chưa có đơn hàng COD nào được giao thành công.' : 'Ngày đã chọn chưa có đơn hàng COD nào được giao thành công.'}"></p>
        </div>
        <p class="vfd-alert vfd-alert-warning" th:if="${codSummary.unresolvedCount > 0}"
           th:text="|Có ${codSummary.unresolvedCount} hồ sơ COD chưa đủ dữ liệu xác định người hoàn tất hoặc phương thức thanh toán; chưa cộng vào tổng.|"></p>
    </main>
    <footer th:replace="~{fragments/delivery-layout :: footer}"></footer>
</div>
</body>
</html>
