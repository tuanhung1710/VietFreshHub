<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Đơn hàng</title>
    <style>
        table {
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
        }
    </style>
    <style th:replace="~{store_manager/order-filters :: styles}"></style>
</head>
<body>
<div>
    <span th:replace="~{fragments/notifications :: bell}"></span>
</div>
<a th:href="@{/seller}">Trang chủ</a>
<h1 th:text="${pageTitle}">Đơn hàng</h1>
<div th:replace="~{store_manager/order-filters :: filters(${orderView}, ${filterAction}, ${showStatusFilter}, ${orderView != 'completed'}, ${totalElements})}"></div>
<table>
    <thead>
    <tr>
        <th scope="col">STT</th>
        <th scope="col">Mã đơn hàng</th>
        <th scope="col">Khách hàng</th>
        <th scope="col">Ngày đặt hàng</th>
        <th scope="col">Số tiền</th>
        <th scope="col">Trạng thái đơn hàng</th>
        <th scope="col">Trạng thái thanh toán</th>
        <th scope="col">Chi tiết</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${#lists.isEmpty(orders)}">
        <td colspan="8" th:text="${emptyMessage}"></td>
    </tr>
    <tr th:each="order, row : ${orders}">
        <td th:text="${pageOffset + row.index + 1}"></td>
        <td style="overflow-wrap:anywhere"><span th:text="${order.orderCode}"></span>
            <button type="button" th:attr="data-vf-copy-code=${order.orderCode},aria-label=${'Sao chép mã đơn '+order.orderCode}">Sao chép</button>
        </td>
        <td th:text="${order.customerName}"></td>
        <td th:text="${#temporals.format(order.placedAt, 'dd-MM-yyyy HH:mm')}"></td>
        <td th:text="${#numbers.formatDecimal(order.totalAmount, 1, 'WHITESPACE', 0, 'POINT') + ' VND'}"></td>
        <td th:text="${order.orderStatusLabel}"></td>
        <td th:switch="${order.paymentStatus}">
            <span th:case="'UNPAID'">Chưa thu tiền</span>
            <span th:case="'PENDING'">Đang chờ thanh toán</span>
            <span th:case="'PAID'">Đã thanh toán</span>
            <span th:case="'FAILED'">Thanh toán thất bại</span>
            <span th:case="'PARTIALLY_REFUNDED'">Hoàn tiền một phần</span>
            <span th:case="'REFUNDED'">Đã hoàn tiền</span>
            <span th:case="*">Cập nhật thanh toán</span>
        </td>
        <td>
            <a th:href="@{/seller/orders/{shopOrderId}(shopOrderId=${order.shopOrderId})}">Xem</a>
        </td>
    </tr>
    </tbody>
</table>
<nav th:replace="~{store_manager/order-filters :: pagination(${filterAction})}"></nav>
<script th:src="@{/js/product/module.js}" defer></script>
</body>
</html>
