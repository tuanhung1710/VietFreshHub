<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <th:block th:replace="~{fragments/interface-layout :: foundation}"></th:block>
    
    
    
    <title>Tài khoản nhận payout · VietFresh Hub</title>
    <link rel="stylesheet" th:href="@{/css/store-manager-payout.css}">
    <th:block th:replace="~{fragments/interface-layout :: styles}"></th:block>
</head>
<body class="vfo-app vfr-app vfr-seller" data-vfr-section="payout">
<th:block th:replace="~{fragments/interface-layout :: navigation('seller','payout')}"></th:block>

<div class="vfo-workspace vfr-workspace" id="order-content" tabindex="-1">
<main class="payout-page vfr-page">
    <header class="page-heading">
        <h1>Tài khoản nhận payout</h1>
    </header>

    <div th:if="${successMessage}" class="notice success" role="status" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="notice error" role="alert" th:text="${errorMessage}"></div>

    <section class="account-panel" aria-labelledby="account-title">
        <div class="status-row">
            <div>
                <h2 id="account-title" th:text="${payoutAccount.hasAccount ? 'Thông tin tài khoản' : 'Thêm tài khoản nhận tiền'}">Tài khoản nhận tiền</h2>
                <p th:if="${!payoutAccount.hasAccount}" class="muted">Bạn chưa khai báo tài khoản nhận payout.</p>
                <p th:if="${payoutAccount.hasAccount}" class="status verified">Đã khai báo tài khoản nhận tiền</p>
            </div>
        </div>

        <form method="post" th:action="@{/seller/payout-account}" class="account-form">
            <label for="bankSelection">Ngân hàng</label>
            <select id="bankSelection" required class="form-control">
                <option value="" disabled th:selected="${#strings.isEmpty(payoutAccount.bankCode)}">Chọn ngân hàng</option>
                <option th:each="bank : ${bankOptions}"
                        th:value="${bank.code}"
                        th:attr="data-bank-name=${bank.name}"
                        th:selected="${bank.code == payoutAccount.bankCode}"
                        th:text="${bank.name + ' (' + bank.code + ')'}">Vietcombank (VCB)</option>
            </select>
            <input id="bankCode" name="bankCode" type="hidden" th:value="${payoutAccount.bankCode}">
            <input id="bankName" name="bankName" type="hidden" th:value="${payoutAccount.bankName}">

            <label for="accountNumber">Số tài khoản</label>
            <input id="accountNumber" name="accountNumber" maxlength="20" required autocomplete="off"
                   inputmode="numeric" pattern="[0-9]{6,20}"
                   title="Số tài khoản phải gồm từ 6 đến 20 chữ số."
                   placeholder="Số tài khoản nhận tiền" th:value="${payoutAccount.accountNumber}" class="form-control">

            <label for="accountHolder">Tên chủ tài khoản</label>
            <input id="accountHolder" name="accountHolder" maxlength="150" required autocomplete="name"
                   placeholder="Tên đúng như đăng ký với ngân hàng" th:value="${payoutAccount.accountHolder}" class="form-control">

            <button type="submit" class="save-button">Lưu tài khoản</button>
        </form>
    </section>
</main>
<footer th:replace="~{fragments/seller-orders :: footer}"></footer>
</div>
<script>
    const bankSelection = document.getElementById('bankSelection');
    const bankCode = document.getElementById('bankCode');
    const bankName = document.getElementById('bankName');

    function syncSelectedBank() {
        const selectedOption = bankSelection.selectedOptions[0];
        bankCode.value = bankSelection.value;
        bankName.value = selectedOption?.dataset.bankName ?? '';
    }

    bankSelection.addEventListener('change', syncSelectedBank);
    syncSelectedBank();
</script>
</body>
</html>
