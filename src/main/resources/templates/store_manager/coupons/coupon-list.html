<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý coupon</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">
<main class="container-xl py-4">

    <div class="d-flex flex-wrap gap-2 mb-4">
        <a th:href="@{/seller}" class="btn btn-outline-secondary">
            Quay lại cửa hàng
        </a>

        <a th:href="@{/seller/promotions}"
           class="btn btn-outline-success">
            Quản lý khuyến mãi
        </a>
    </div>

    <div class="d-flex flex-wrap justify-content-between
                align-items-center gap-3 mb-4">
        <h1 class="h3 mb-0">Quản lý coupon</h1>

        <a th:href="@{/manager/coupons/new}" class="btn btn-success">
            Tạo coupon
        </a>
    </div>

    <div th:if="${successMessage}"
         th:text="${successMessage}"
         class="alert alert-success"
         role="status">
    </div>

    <div th:if="${errorMessage}"
         th:text="${errorMessage}"
         class="alert alert-danger"
         role="alert">
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white py-3">
            <strong>Danh sách mã giảm giá</strong>
            <span class="text-muted ms-2"
                  th:text="${'(' + #lists.size(coupons) + ' mã)'}">
            </span>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th scope="col">STT</th>
                    <th scope="col">Mã coupon</th>
                    <th scope="col">Chương trình</th>
                    <th scope="col">Giới hạn lượt</th>
                    <th scope="col">Đơn tối thiểu</th>
                    <th scope="col">Thời hạn</th>
                    <th scope="col">Trạng thái bật/tắt</th>
                    <th scope="col">Thao tác</th>
                </tr>
                </thead>

                <tbody>
                <tr th:if="${#lists.isEmpty(coupons)}">
                    <td colspan="8" class="text-center text-muted py-5">
                        Chưa có coupon nào.
                    </td>
                </tr>

                <tr th:each="coupon, row : ${coupons}">
                    <td th:text="${row.count}"></td>

                    <td class="fw-bold text-success"
                        th:text="${coupon.code}">
                    </td>

                    <td th:text="${coupon.promotionName}"></td>

                    <td class="small">
                        <div>
                            Tổng:
                            <span th:text="${coupon.usageLimit == null
                                    ? 'Không giới hạn'
                                    : coupon.usageLimit}">
                            </span>
                        </div>

                        <div class="text-muted">
                            Mỗi khách:
                            <span th:text="${coupon.perUserLimit == null
                                    ? 'Không giới hạn'
                                    : coupon.perUserLimit}">
                            </span>
                        </div>
                    </td>

                    <td class="text-nowrap"
                        th:text="${#numbers.formatDecimal(
                            coupon.minimumOrderValue,
                            1, 'WHITESPACE', 2, 'POINT'
                        ) + ' VND'}">
                    </td>

                    <td class="small text-nowrap">
                        <div>
                            Từ:
                            <span th:text="${#temporals.format(
                                coupon.startAt, 'dd/MM/yyyy HH:mm'
                            )}"></span>
                        </div>

                        <div>
                            Đến:
                            <span th:text="${#temporals.format(
                                coupon.endAt, 'dd/MM/yyyy HH:mm'
                            )}"></span>
                        </div>
                    </td>

                    <td th:switch="${coupon.status.name()}">
                        <span th:case="'ACTIVE'"
                              class="badge bg-success-subtle text-success">
                            Đã bật
                        </span>

                        <span th:case="'INACTIVE'"
                              class="badge bg-secondary-subtle text-secondary">
                            Đang tắt
                        </span>

                        <span th:case="'EXPIRED'"
                              class="badge bg-warning-subtle text-warning-emphasis">
                            Đã hết hạn
                        </span>

                        <span th:case="'DISABLED'"
                              class="badge bg-danger-subtle text-danger">
                            Đã vô hiệu hóa
                        </span>
                    </td>

                    <td>
                        <div class="d-flex flex-wrap gap-2">
                            <a th:if="${coupon.status.name() == 'INACTIVE'}"
                               th:href="@{/manager/coupons/{id}/edit(
                                   id=${coupon.couponId}
                               )}"
                               class="btn btn-sm btn-outline-success">
                                Sửa
                            </a>

                            <form th:if="${coupon.status.name() == 'INACTIVE'}"
                                  th:action="@{/manager/coupons/{id}/activate(
                                      id=${coupon.couponId}
                                  )}"
                                  method="post"
                                  class="m-0">
                                <button type="submit"
                                        class="btn btn-sm btn-success">
                                    Bật
                                </button>
                            </form>

                            <form th:if="${coupon.status.name() == 'ACTIVE'}"
                                  th:action="@{/manager/coupons/{id}/deactivate(
                                      id=${coupon.couponId}
                                  )}"
                                  method="post"
                                  class="m-0">
                                <button type="submit"
                                        class="btn btn-sm btn-outline-secondary">
                                    Tắt
                                </button>
                            </form>

                            <form th:if="${coupon.status.name() != 'DISABLED'}"
                                  th:action="@{/manager/coupons/{id}/disable(
                                      id=${coupon.couponId}
                                  )}"
                                  method="post"
                                  class="m-0"
                                  onsubmit="return confirm('Vô hiệu hóa vĩnh viễn coupon này? Bạn sẽ không thể bật lại.');">
                                <button type="submit"
                                        class="btn btn-sm btn-outline-danger">
                                    Vô hiệu hóa
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>
</body>
</html>
