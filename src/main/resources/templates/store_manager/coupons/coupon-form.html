<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${couponId != null ? 'Sửa coupon' : 'Tạo coupon'}">
        Coupon
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">
<main class="container py-4">

    <div class="row justify-content-center">
        <div class="col-lg-9 col-xl-8">

            <a th:href="@{/manager/coupons}"
               class="btn btn-outline-secondary mb-3">
                Quay lại danh sách
            </a>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">

                    <h1 class="h3 mb-4"
                        th:text="${couponId != null
                            ? 'Sửa coupon'
                            : 'Tạo coupon'}">
                    </h1>

                    <div th:if="${#lists.isEmpty(promotions)}"
                         class="alert alert-warning">
                        Không có chương trình khuyến mãi còn hạn và hợp lệ để chọn.
                        <a th:href="@{/manager/promotions/new}">
                            Tạo chương trình mới
                        </a>
                    </div>

                    <form th:action="${couponId != null}
                              ? @{/manager/coupons/{id}/edit(id=${couponId})}
                              : @{/manager/coupons}"
                          th:object="${couponForm}"
                          method="post">

                        <div th:if="${#fields.hasAnyErrors()}"
                             class="alert alert-danger"
                             role="alert">
                            <strong>Vui lòng kiểm tra lại:</strong>

                            <ul class="mb-0 mt-2">
                                <li th:each="error : ${#fields.allErrors()}"
                                    th:text="${error}">
                                </li>
                            </ul>
                        </div>

                        <div class="mb-3">
                            <label for="promotionId" class="form-label">
                                Chương trình khuyến mãi *
                            </label>

                            <select id="promotionId"
                                    th:field="*{promotionId}"
                                    th:errorclass="is-invalid"
                                    class="form-select"
                                    required>
                                <option value="">
                                    -- Chọn chương trình --
                                </option>

                                <option th:each="promotion : ${promotions}"
                                        th:value="${promotion.promotionId}"
                                        th:text="${promotion.name + ' | '
                                            + #temporals.format(
                                                promotion.startAt,
                                                'dd/MM/yyyy HH:mm'
                                            )
                                            + ' → '
                                            + #temporals.format(
                                                promotion.endAt,
                                                'dd/MM/yyyy HH:mm'
                                            )}">
                                </option>
                            </select>

                            <div class="invalid-feedback"
                                 th:errors="*{promotionId}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="code" class="form-label">
                                Mã coupon *
                            </label>

                            <input id="code"
                                   type="text"
                                   th:field="*{code}"
                                   th:errorclass="is-invalid"
                                   class="form-control"
                                   placeholder="Ví dụ: FRESH10"
                                   maxlength="100"
                                   required>

                            <div class="invalid-feedback"
                                 th:errors="*{code}">
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="usageLimit" class="form-label">
                                    Tổng lượt sử dụng tối đa
                                </label>

                                <input id="usageLimit"
                                       type="number"
                                       th:field="*{usageLimit}"
                                       th:errorclass="is-invalid"
                                       class="form-control"
                                       min="1"
                                       max="2147483647"
                                       step="1">

                                <div class="invalid-feedback"
                                     th:errors="*{usageLimit}">
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label for="perUserLimit" class="form-label">
                                    Lượt tối đa mỗi khách
                                </label>

                                <input id="perUserLimit"
                                       type="number"
                                       th:field="*{perUserLimit}"
                                       th:errorclass="is-invalid"
                                       class="form-control"
                                       min="1"
                                       max="2147483647"
                                       step="1">

                                <div class="invalid-feedback"
                                     th:errors="*{perUserLimit}">
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="minimumOrderValue" class="form-label">
                                Giá trị đơn tối thiểu (VND) *
                            </label>

                            <input id="minimumOrderValue"
                                   type="number"
                                   th:field="*{minimumOrderValue}"
                                   th:errorclass="is-invalid"
                                   class="form-control"
                                   min="0"
                                   step="0.01"
                                   required>

                            <div class="invalid-feedback"
                                 th:errors="*{minimumOrderValue}">
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="startAt" class="form-label">
                                    Thời gian bắt đầu *
                                </label>

                                <input id="startAt"
                                       type="datetime-local"
                                       th:field="*{startAt}"
                                       th:errorclass="is-invalid"
                                       class="form-control"
                                       required>

                                <div class="invalid-feedback"
                                     th:errors="*{startAt}">
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label for="endAt" class="form-label">
                                    Thời gian kết thúc *
                                </label>

                                <input id="endAt"
                                       type="datetime-local"
                                       th:field="*{endAt}"
                                       th:errorclass="is-invalid"
                                       class="form-control"
                                       required>

                                <div class="invalid-feedback"
                                     th:errors="*{endAt}">
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end
                                    gap-2 border-top pt-3">
                            <a th:href="@{/manager/coupons}"
                               class="btn btn-outline-secondary">
                                Hủy
                            </a>

                            <button type="submit"
                                    class="btn btn-success"
                                    th:disabled="${#lists.isEmpty(promotions)}"
                                    th:text="${couponId != null
                                        ? 'Lưu thay đổi'
                                        : 'Tạo coupon'}">
                            </button>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>

</main>
</body>
</html>
