<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <link th:fragment="styles" rel="stylesheet" th:href="@{/css/store-manager-orders.css}">
</head>
<body>
<div class="vfo-filter-region" th:fragment="filters(orderView, filterAction, showStatusFilter, showPaymentFilter, resultCount)">
    <div class="order-filter-toolbar">
        <form class="order-search-form" method="get" role="search" th:action="@{${filterAction}}">
            <input type="hidden" name="size" th:value="${filter.size}">
            <input class="form-control" type="search" name="keyword" th:value="${filter.keyword}"
                   aria-label="Tìm theo mã đơn hàng hoặc khách hàng"
                   placeholder="Tìm theo mã đơn hàng hoặc khách hàng">
            <button class="btn order-search-button" type="submit"><svg class="vfo-icon" aria-hidden="true"><use href="#vfo-search"/></svg>Tìm kiếm</button>
            <input type="hidden" name="fromDate" th:value="${filter.fromDate}">
            <input type="hidden" name="toDate" th:value="${filter.toDate}">
            <input type="hidden" name="priceRange" th:each="value : ${filter.priceRange}" th:value="${value}">
            <input th:if="${showStatusFilter}" type="hidden" name="status" th:each="value : ${filter.status}" th:value="${value}">
            <input th:if="${showPaymentFilter}" type="hidden" name="paymentStatus" th:each="value : ${filter.paymentStatus}" th:value="${value}">
            <input type="hidden" name="sort" th:value="${filter.sort}">
        </form>
        <form class="order-sort-form" method="get" th:action="@{${filterAction}}">
            <input type="hidden" name="size" th:value="${filter.size}">
            <label for="order-sort">Sắp xếp theo</label>
            <select class="form-select" id="order-sort" name="sort">
                <option value="NEWEST" th:selected="${filter.sort == 'NEWEST'}">Ngày đặt hàng: Mới nhất trước</option>
                <option value="OLDEST" th:selected="${filter.sort == 'OLDEST'}">Ngày đặt hàng: Cũ nhất trước</option>
                <option value="PRICE_HIGH" th:selected="${filter.sort == 'PRICE_HIGH'}">Giá trị đơn hàng: Cao nhất trước</option>
                <option value="PRICE_LOW" th:selected="${filter.sort == 'PRICE_LOW'}">Giá trị đơn hàng: Thấp nhất trước</option>
            </select>
            <noscript><button class="order-search-button" type="submit">Sắp xếp</button></noscript>
            <input type="hidden" name="page" value="0">
            <input type="hidden" name="keyword" th:value="${filter.keyword}">
            <input type="hidden" name="fromDate" th:value="${filter.fromDate}">
            <input type="hidden" name="toDate" th:value="${filter.toDate}">
            <input type="hidden" name="priceRange" th:each="value : ${filter.priceRange}" th:value="${value}">
            <input th:if="${showStatusFilter}" type="hidden" name="status" th:each="value : ${filter.status}" th:value="${value}">
            <input th:if="${showPaymentFilter}" type="hidden" name="paymentStatus" th:each="value : ${filter.paymentStatus}" th:value="${value}">
        </form>
        <button id="open-order-filter" class="btn order-filter-button" type="button"
                aria-haspopup="dialog" aria-controls="order-filter-dialog"><svg class="vfo-icon" aria-hidden="true"><use href="#vfo-filter"/></svg>Bộ lọc</button>
    </div>
    <dialog id="order-filter-dialog" class="order-filter-dialog" aria-labelledby="order-filter-title">
        <div class="order-filter-header">
            <div><p class="vfo-eyebrow">Tìm đúng đơn hàng bạn cần</p><h2 id="order-filter-title">Bộ lọc đơn hàng</h2></div>
            <button id="close-order-filter" class="order-filter-close" type="button" aria-label="Đóng bộ lọc">×</button>
        </div>
        <form id="order-filter-form" method="get" novalidate th:action="@{${filterAction}}"
              th:attr="data-count-url=@{/seller/orders/filter-count},data-view=${orderView}">
            <input type="hidden" name="size" th:value="${filter.size}">
            <input type="hidden" name="keyword" th:value="${filter.keyword}">
            <input type="hidden" name="sort" th:value="${filter.sort}">
            <fieldset>
                <legend>Ngày đặt hàng</legend>
                <div class="order-filter-dates">
                    <label for="fromDate">Từ ngày</label>
                    <input class="form-control" id="fromDate" name="fromDate" type="date" th:value="${filter.fromDate}" aria-describedby="fromDate-error">
                    <p id="fromDate-error" class="order-filter-date-error" aria-live="polite"></p>
                    <span class="order-filter-date-separator" aria-hidden="true">-</span>
                    <label for="toDate">Đến ngày</label>
                    <input class="form-control" id="toDate" name="toDate" type="date" th:value="${filter.toDate}" aria-describedby="toDate-error">
                    <p id="toDate-error" class="order-filter-date-error" aria-live="polite"></p>
                </div>
            </fieldset>
            <fieldset>
                <legend>Khoảng giá</legend>
                <div class="order-filter-options">
                    <label><input type="checkbox" name="priceRange" value="UNDER_100K"
                                  th:checked="${#lists.contains(filter.priceRange, 'UNDER_100K')}"><span>Dưới 100.000 VND</span></label>
                    <label><input type="checkbox" name="priceRange" value="FROM_100K_TO_300K"
                                  th:checked="${#lists.contains(filter.priceRange, 'FROM_100K_TO_300K')}"><span>100.000 - 300.000 VND</span></label>
                    <label><input type="checkbox" name="priceRange" value="FROM_300K_TO_500K"
                                  th:checked="${#lists.contains(filter.priceRange, 'FROM_300K_TO_500K')}"><span>300.000 - 500.000 VND</span></label>
                    <label><input type="checkbox" name="priceRange" value="FROM_500K_TO_1M"
                                  th:checked="${#lists.contains(filter.priceRange, 'FROM_500K_TO_1M')}"><span>500.000 - 1.000.000 VND</span></label>
                    <label><input type="checkbox" name="priceRange" value="FROM_1M_TO_2M"
                                  th:checked="${#lists.contains(filter.priceRange, 'FROM_1M_TO_2M')}"><span>1.000.000 - 2.000.000 VND</span></label>
                    <label><input type="checkbox" name="priceRange" value="OVER_2M"
                                  th:checked="${#lists.contains(filter.priceRange, 'OVER_2M')}"><span>Trên 2.000.000 VND</span></label>
                </div>
            </fieldset>
            <fieldset th:if="${showStatusFilter}">
                <legend>Trạng thái đơn hàng</legend>
                <div class="order-filter-options">
                    <label><input type="checkbox" name="status" value="" data-filter-all
                                  th:checked="${#lists.isEmpty(filter.status)}"><span>Tất cả</span></label>
                    <th:block th:if="${orderView == 'all'}">
                        <label><input type="checkbox" name="status" value="PENDING"
                                      th:checked="${#lists.contains(filter.status, 'PENDING')}"><span>Chờ xác nhận</span></label>
                        <label><input type="checkbox" name="status" value="CONFIRMED"
                                      th:checked="${#lists.contains(filter.status, 'CONFIRMED')}"><span>Đã xác nhận</span></label>
                        <label><input type="checkbox" name="status" value="PREPARING"
                                      th:checked="${#lists.contains(filter.status, 'PREPARING')}"><span>Đang chuẩn bị</span></label>
                        <label><input type="checkbox" name="status" value="READY_FOR_DELIVERY"
                                      th:checked="${#lists.contains(filter.status, 'READY_FOR_DELIVERY')}"><span>Sẵn sàng giao hàng</span></label>
                        <label><input type="checkbox" name="status" value="OUT_FOR_DELIVERY"
                                      th:checked="${#lists.contains(filter.status, 'OUT_FOR_DELIVERY')}"><span>Đang giao hàng</span></label>
                        <label><input type="checkbox" name="status" value="DELIVERY_FAILED"
                                      th:checked="${#lists.contains(filter.status, 'DELIVERY_FAILED')}"><span>Giao hàng thất bại</span></label>
                    </th:block>
                    <label><input type="checkbox" name="status" value="COMPLETED"
                                  th:checked="${#lists.contains(filter.status, 'COMPLETED')}"><span>Hoàn thành</span></label>
                    <label><input type="checkbox" name="status" value="CANCELLED"
                                  th:checked="${#lists.contains(filter.status, 'CANCELLED')}"><span>Đã hủy</span></label>
                </div>
            </fieldset>
            <fieldset th:if="${showPaymentFilter}">
                <legend>Trạng thái thanh toán</legend>
                <div class="order-filter-options">
                    <label><input type="checkbox" name="paymentStatus" value="" data-filter-all
                                  th:checked="${#lists.isEmpty(filter.paymentStatus)}"><span>Tất cả</span></label>
                    <label th:each="option : ${paymentStatusOptions}"><input type="checkbox" name="paymentStatus" th:value="${option.key}"
                                  th:checked="${#lists.contains(filter.paymentStatus, option.key)}"><span th:text="${option.value}"></span></label>
                </div>
            </fieldset>
            <p id="order-filter-error" class="order-filter-error" role="alert" hidden></p>
            <div class="order-filter-actions">
                <a class="btn order-filter-clear" th:href="@{${filterAction}(keyword=${filter.keyword},sort=${filter.sort})}">Xóa bộ lọc</a>
                <button id="apply-order-filter" class="btn order-filter-apply" type="submit" aria-live="polite"
                        th:text="${resultCount + ' KẾT QUẢ'}">KẾT QUẢ</button>
            </div>
        </form>
    </dialog>
    <script>
        const orderFilterDialog = document.getElementById('order-filter-dialog');
        const orderFilterForm = document.getElementById('order-filter-form');
        const openOrderFilter = document.getElementById('open-order-filter');
        const applyOrderFilter = document.getElementById('apply-order-filter');
        const orderFilterError = document.getElementById('order-filter-error');
        const fromDateInput = document.getElementById('fromDate');
        const toDateInput = document.getElementById('toDate');
        const fromDateError = document.getElementById('fromDate-error');
        const toDateError = document.getElementById('toDate-error');

        document.getElementById('order-sort').addEventListener('change', event => {
            event.currentTarget.form.requestSubmit();
        });

        let orderCountRequest;
        let orderCountReady = false;

        function isOrderDateAfter(date, limit) {
            if (!date || !limit) {
                return false;
            }
            if (date.length !== limit.length) {
                return date.length > limit.length;
            }
            return date > limit;
        }

        function validateOrderDateRange() {
            const dateParts = new Intl.DateTimeFormat('en', {
                timeZone: 'Asia/Ho_Chi_Minh',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            }).formatToParts(new Date());
            const today = ['year', 'month', 'day']
                .map(type => dateParts.find(part => part.type === type).value).join('-');
            const fromDate = fromDateInput.value;
            const toDate = toDateInput.value;
            let fromMessage = fromDateInput.validity.badInput ? 'Vui lòng nhập Từ ngày hợp lệ.' : '';
            let toMessage = toDateInput.validity.badInput ? 'Vui lòng nhập Đến ngày hợp lệ.' : '';

            if (isOrderDateAfter(fromDate, today)) {
                fromMessage = 'Từ ngày không được lớn hơn ngày hiện tại.';
            }
            if (isOrderDateAfter(toDate, today)) {
                toMessage = 'Đến ngày không được lớn hơn ngày hiện tại.';
            }
            if (isOrderDateAfter(fromDate, toDate)) {
                fromMessage += (fromMessage ? ' ' : '') + 'Từ ngày không được sau Đến ngày.';
            }

            toDateInput.max = today;
            fromDateInput.max = toDate && !isOrderDateAfter(toDate, today) ? toDate : today;
            if (fromDate) {
                toDateInput.min = fromDate;
            } else {
                toDateInput.removeAttribute('min');
            }

            fromDateError.textContent = fromMessage;
            toDateError.textContent = toMessage;
            fromDateInput.setAttribute('aria-invalid', String(Boolean(fromMessage)));
            toDateInput.setAttribute('aria-invalid', String(Boolean(toMessage)));
            const valid = !fromMessage && !toMessage;
            if (!valid) {
                if (orderCountRequest) {
                    orderCountRequest.abort();
                }
                orderCountReady = false;
                applyOrderFilter.disabled = true;
                applyOrderFilter.textContent = 'KIỂM TRA NGÀY';
            }
            return valid;
        }

        async function refreshOrderFilterCount() {
            if (orderCountRequest) {
                orderCountRequest.abort();
            }
            orderCountReady = false;
            orderFilterError.hidden = true;
            if (!validateOrderDateRange()) {
                return;
            }
            const request = new AbortController();
            orderCountRequest = request;
            applyOrderFilter.disabled = true;
            applyOrderFilter.textContent = 'ĐANG ĐẾM...';
            const parameters = new URLSearchParams(new FormData(orderFilterForm));
            parameters.set('view', orderFilterForm.dataset.view);
            try {
                const response = await fetch(orderFilterForm.dataset.countUrl + '?' + parameters.toString(), {
                    signal: request.signal,
                    cache: 'no-store',
                    headers: {'Accept': 'application/json'}
                });
                if (!response.ok || response.redirected) {
                    throw new Error('Không thể tải số kết quả.');
                }
                const count = await response.json();
                if (request.signal.aborted) {
                    return;
                }
                if (!Number.isInteger(count) || count < 0) {
                    throw new Error('Số kết quả không hợp lệ.');
                }
                applyOrderFilter.textContent = count + ' KẾT QUẢ';
                applyOrderFilter.disabled = false;
                orderCountReady = true;
            } catch (error) {
                if (request.signal.aborted) {
                    return;
                }
                applyOrderFilter.textContent = 'THỬ LẠI';
                applyOrderFilter.disabled = false;
                orderFilterError.textContent = 'Không thể tải số kết quả. Vui lòng thử lại.';
                orderFilterError.hidden = false;
            }
        }

        validateOrderDateRange();

        openOrderFilter.addEventListener('click', () => {
            orderFilterForm.reset();
            orderFilterDialog.showModal();
            refreshOrderFilterCount();
        });
        document.getElementById('close-order-filter').addEventListener('click', () => orderFilterDialog.close());
        orderFilterDialog.addEventListener('close', () => {
            if (orderCountRequest) {
                orderCountRequest.abort();
            }
        });
        orderFilterForm.addEventListener('input', event => {
            const option = event.target;
            if (option.matches('.order-filter-options input[type="checkbox"]')) {
                const group = option.closest('.order-filter-options');
                const allOption = group.querySelector('[data-filter-all]');
                if (allOption) {
                    const choices = [...group.querySelectorAll('input[type="checkbox"]:not([data-filter-all])')];
                    if (option === allOption && allOption.checked) {
                        choices.forEach(choice => choice.checked = false);
                    }
                    allOption.checked = !choices.some(choice => choice.checked);
                }
            }
            refreshOrderFilterCount();
        });
        orderFilterForm.addEventListener('submit', (event) => {
            if (!validateOrderDateRange()) {
                event.preventDefault();
                return;
            }
            if (!orderCountReady) {
                event.preventDefault();
                refreshOrderFilterCount();
            }
        });
    </script>
</div>
<nav th:fragment="pagination(filterAction)">
    <div th:replace="~{fragments/pagination :: panel(${ordersPage},
        @{${filterAction}(page=${ordersPage.number - 1},size=${ordersPage.size},keyword=${filter.keyword},fromDate=${filter.fromDate},toDate=${filter.toDate},priceRange=${filter.priceRange},status=${filter.status},paymentStatus=${filter.paymentStatus},sort=${filter.sort})},
        @{${filterAction}(page=${ordersPage.number + 1},size=${ordersPage.size},keyword=${filter.keyword},fromDate=${filter.fromDate},toDate=${filter.toDate},priceRange=${filter.priceRange},status=${filter.status},paymentStatus=${filter.paymentStatus},sort=${filter.sort})},
        @{${filterAction} }, ${ {'keyword': filter.keyword, 'fromDate': filter.fromDate, 'toDate': filter.toDate, 'priceRange': filter.priceRange, 'status': filter.status, 'paymentStatus': filter.paymentStatus, 'sort': filter.sort} },
        'Phân trang đơn hàng', 'đơn hàng', 'Đơn hàng mỗi trang')}"></div>
</nav>
</body>
</html>
